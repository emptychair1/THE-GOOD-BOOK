<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171715"><title>The Good Book · Image Gallery</title><style>*{box-sizing:border-box}html,body{margin:0;background:#171715;color:#e4e4e2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:max(18px,env(safe-area-inset-top)) 14px max(32px,env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:5;background:rgba(23,23,21,.94);backdrop-filter:blur(12px);padding:8px 0 14px}h1{font-size:15px;letter-spacing:.14em;margin:0 0 5px}p{font-size:11px;color:#8f8f8a;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.card{border:1px solid #353532;background:#11110f;padding:7px;border-radius:5px}.thumb{aspect-ratio:1/1;background:#0a0a09;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain;display:block}.name{font-size:10px;line-height:1.3;overflow-wrap:anywhere;padding:7px 1px 1px;color:#d4d4d0}.status{padding:28px 4px;color:#8f8f8a;font-size:12px}.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.96);display:none;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom))}.overlay.open{display:flex}.overlay img{min-height:0;flex:1;width:100%;object-fit:contain}.bar{display:flex;gap:8px;align-items:center;padding-top:10px}.bar code{flex:1;font-size:12px;overflow-wrap:anywhere}.bar button{font:inherit;background:#e4e4e2;color:#171715;border:0;border-radius:4px;padding:10px 12px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(min-width:1100px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}</style></head><body><header><h1>THE GOOD BOOK · BOOK PHOTOS</h1><p>assets/book-photos · tap any image for full-size + filename</p></header><main id="grid" class="grid"></main><div id="status" class="status">Loading image index…</div><div id="overlay" class="overlay"><img id="full" alt=""><div class="bar"><code id="fullName"></code><button id="copy">COPY</button><button id="close">CLOSE</button></div></div><script>const owner='emptychair1',repo='THE-GOOD-BOOK',branch='main',dir='assets/book-photos',grid=document.querySelector('#grid'),status=document.querySelector('#status'),overlay=document.querySelector('#overlay'),full=document.querySelector('#full'),fullName=document.querySelector('#fullName');const isImage=n=>/\.(png|jpe?g|webp|gif)$/i.test(n);async function load(){try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${dir}?ref=${branch}`,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(`GitHub ${r.status}`);const files=(await r.json()).filter(x=>x.type==='file'&&isImage(x.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));status.remove();for(const f of files){const card=document.createElement('div');card.className='card';card.innerHTML=`<div class="thumb"><img loading="lazy" src="${f.download_url}" alt="${f.name}"></div><div class="name">${f.name}</div>`;card.onclick=()=>{full.src=f.download_url;fullName.textContent=f.name;overlay.classList.add('open')};grid.append(card)}}catch(e){status.textContent='Could not load GitHub image index: '+e.message}}load();document.querySelector('#close').onclick=()=>overlay.classList.remove('open');overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(fullName.textContent);document.querySelector('#copy').textContent='COPIED';setTimeout(()=>document.querySelector('#copy').textContent='COPY',900)}</script></body></html>
