<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Image Treatment Lab</title>
<style>
:root{color-scheme:dark;--paper:#000;--ink:#f4f0e6}
*{box-sizing:border-box}
body{margin:0;background:#111;color:var(--ink);font:14px/1.4 system-ui,sans-serif}
header{padding:16px;position:sticky;top:0;background:#111e;backdrop-filter:blur(10px);z-index:3}
h1{font-size:17px;margin:0 0 5px}.note{opacity:.7;font-size:12px}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px 16px}
label{display:grid;gap:4px;font-size:12px}input[type=range]{width:100%}
button,select{font:inherit;padding:8px;background:#222;color:#fff;border:1px solid #555;border-radius:6px}
.stage{width:min(100%,720px);margin:auto;background:var(--paper);min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.stage.landscape{width:100vw;max-width:none;min-height:auto;height:100vw;max-height:100svh;transform:none}
img{display:block;max-width:none;filter:grayscale(100%) brightness(var(--b,1)) contrast(var(--c,1));}
.stage.portrait img{width:100%;height:100svh;object-fit:cover}
.stage.landscape img{width:100%;height:100%;object-fit:cover}
.readout{padding:12px 16px;font:12px ui-monospace,monospace;white-space:pre-wrap}
@media(min-width:700px){.controls{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>Life Image Treatment Lab</h1><div class="note">Bedroom A/B · same full-bleed geometry · minimum necessary crop · pressed vs pre-press grayscale.</div></header>
<div class="controls">
<label>Source <select id="source"><option value="pressed">A · Numerical press</option><option value="original">B · Pre-press original</option></select></label><label>Image <select id="pick"></select></label><label>Load your image <input id="upload" type="file" accept="image/*"></label>
<label>Orientation <select id="orientation"><option value="portrait">Vertical page</option><option value="landscape">Horizontal page</option></select></label>
<label>Brightness <input id="brightness" type="range" min="60" max="180" value="100"></label>
<label>Contrast <input id="contrast" type="range" min="60" max="220" value="100"></label>

<label>Gamma / midtone <input id="gamma" type="range" min="50" max="180" value="100"></label>
<button id="reset">Reset</button>
</div>
<div id="stage" class="stage portrait"><img id="image" alt=""></div>
<div id="readout" class="readout"></div>
<script>
const candidates=["IMG_3680.png","IMG_3681.png","IMG_4083.png","IMG_4084.png","IMG_4085.png","IMG_4086.png","IMG_4087.png","IMG_4088.png","IMG_4089.png","IMG_4090.png","IMG_4091.png","IMG_4092.png","IMG_4093.png","IMG_4094.png","IMG_4095.png","IMG_4096.png","IMG_4097.png","IMG_4098.png","IMG_4099.png","IMG_4100.png","IMG_4101.png","IMG_4102.png","IMG_4103.png","IMG_4104.png","IMG_4105.png","IMG_4106.png","IMG_4107.png","IMG_4108.png","IMG_4109.png","IMG_4110.png","IMG_4111.png","IMG_4112.png","IMG_4114.png","IMG_4115.png","IMG_4116.png","IMG_4122.png","IMG_4123.png","IMG_4124.png","IMG_4125.png","IMG_4126.jpeg","IMG_4127.png","IMG_4128.png","IMG_4129.png","IMG_4130.png","IMG_4131.png","IMG_4132.png","IMG_4133.png","IMG_4134.png","IMG_4135.png","IMG_4137.png","IMG_4138.png","IMG_4140.png","IMG_4141.png","IMG_4142.png","IMG_4144.png","IMG_4146.png","IMG_4148.png","IMG_4149.png","IMG_4150.png","IMG_4151.png","IMG_4152.png","IMG_4213.png","IMG_4214.png","IMG_4215.png","IMG_4216.png","IMG_4268.png"];
const $=id=>document.getElementById(id), pick=$('pick'), img=$('image'), stage=$('stage'), source=$('source');
pick.value='IMG_4150.png';
candidates.forEach(x=>pick.add(new Option(x,x)));
function gammaFilter(g){ /* CSS has no gamma primitive; approximate midtone lift with brightness+contrast pairing */ return g/100 }
function render(){
 const b=$('brightness').value/100, c=$('contrast').value/100, g=gammaFilter(+$('gamma').value);
 if(!img.dataset.local){ img.src=source.value==='original'?'../assets/pre-press-book-photos/FFAAB6E3-D755-4EA3-B83A-FB669CC05E90.png?v=1':'../assets/book-photos/'+pick.value+'?v=5'; }
 img.style.setProperty('--b',(b*g).toFixed(3));
 img.style.setProperty('--c',(c*(2-g*.5)).toFixed(3));
 
 stage.className='stage '+$('orientation').value;
 $('readout').textContent='source: '+(source.value==='original'?'PRE-PRESS ORIGINAL · FFAAB6E3-D755-4EA3-B83A-FB669CC05E90.png':'NUMERICAL PRESS · '+pick.value)+'\nasset: '+(source.value==='original'?'assets/pre-press-book-photos/FFAAB6E3-D755-4EA3-B83A-FB669CC05E90.png':'assets/book-photos/'+pick.value)+'\norientation: '+$('orientation').value+'\nbrightness: '+b.toFixed(2)+'  contrast: '+c.toFixed(2)+'  grayscale: 100%  midtone: '+g.toFixed(2)+'\nMINIMUM NECESSARY CROP · object-fit: cover';
}
document.querySelectorAll('input:not([type=file]),select').forEach(x=>x.addEventListener('input',render));
$('upload').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);img.src=u;img.dataset.local='1';$('readout').textContent='LOCAL IMAGE: '+f.name+'\nNot uploaded anywhere · treatment is browser-only\nMINIMUM NECESSARY CROP · grayscale · adjust tone below';});
pick.addEventListener('change',()=>{delete img.dataset.local;source.value='pressed';render();});
source.addEventListener('change',()=>{delete img.dataset.local;if(source.value==='original')pick.value='IMG_4150.png';render();});
$('reset').onclick=()=>{brightness.value=contrast.value=gamma.value=100;render()};
render();
</script>
</body></html>
