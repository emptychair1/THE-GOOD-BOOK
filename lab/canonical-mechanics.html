<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Canonical Mechanics Lab</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#171513}body{font-family:Georgia,'Times New Roman',serif}.paper{width:min(100vw,700px);min-height:100vh;margin:auto;background:#f2eee3;padding:5.5rem clamp(1.6rem,7vw,4.5rem) 7rem}.badge{position:fixed;z-index:20;top:max(.7rem,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:600 .56rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:rgba(242,238,227,.72);white-space:nowrap}.kicker,.label{font:700 .58rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;opacity:.46}.title{font-size:clamp(2rem,8vw,3.5rem);font-weight:400;margin:.6rem 0}.lede{line-height:1.55;opacity:.65;margin:0 0 3rem}.card{border-top:1px solid rgba(23,21,19,.18);padding:1.4rem 0 1.8rem}.sample{font-size:clamp(1.25rem,5vw,1.7rem);line-height:1.55;min-height:4rem;padding-top:.8rem;position:relative}.run{appearance:none;border:1px solid rgba(23,21,19,.28);background:transparent;color:inherit;font:700 .58rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;padding:.72rem 1rem}.note{font:.61rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.45;margin:.7rem 0 0}.field{height:9rem;border:1px solid rgba(23,21,19,.12);position:relative;overflow:hidden;margin-top:.8rem}.glyph{position:absolute;font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.48}.target{position:relative;display:inline}.hand-char{display:inline-block;opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.94);filter:blur(.35px)}.hand-live .hand-char{animation:handA .36s cubic-bezier(.2,.8,.2,1) var(--d) forwards}@keyframes handA{55%{opacity:.72;filter:blur(.15px)}100%{opacity:1;transform:none;filter:none;font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}}.compile-char{display:inline-block;min-width:.54em;text-align:center}.compile-live{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.compile-live .compile-char{animation:cellLock .22s steps(2,end) var(--d) both}@keyframes cellLock{0%{opacity:.28;transform:translateY(.08em)}50%{opacity:.7}100%{opacity:1;transform:none}}</style></head><body><div class="badge">THE GOOD BOOK · CANONICAL MECHANICS LAB</div><main class="paper"><div class="kicker">Current library audition</div><h1 class="title">Mechanics</h1><p class="lede">One specimen per mechanic currently registered as canonical. Tap Run to inspect each in isolation. This lab does not change the book.</p><div id="cards"></div></main><script src="../house-mechanics.js"></script><script>
const HM=window.HouseMechanics,cards=document.getElementById('cards');
const specs=[['ORGANIC_FIELD','biology'],['GLYPH_CURRENT','314159265358979'],['DIAGNOSTIC','artificial minds'],['ABSENCE','hurt'],['DISTANCE','Just bones.'],['FALL','Maybe nothing remains.'],['TENDRIL_PIPER','Piper'],['CROSS_OUT','authority'],['RETURN_REGISTRATION','returned'],['GLINT','imagination'],['THUNDERCLAP','certainty'],['AGENCY_GO','go'],['OBSERVATION_WATCHED','watched'],['LOVE_LEAN','love'],['CHANGE_REORIENT','changed'],['HAND','What can they do for us?'],['COMPILE_INTERPRET','There will be code']];
for(const [name,text] of specs){const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="label">${name}</div><div class="sample"><span class="target">${text}</span></div><button class="run">Run</button><p class="note">${HM[name]?.meaning||''}</p>`;cards.appendChild(c);c.querySelector('.run').onclick=()=>run(name,c.querySelector('.target'),c.querySelector('.sample'),text)}
function reset(el,text){el.removeAttribute('style');el.className='target';el.textContent=text;el.querySelectorAll('*').forEach(x=>x.remove())}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(name,el,host,text){reset(el,text);if(name==='DIAGNOSTIC'){HM.runFullDiagnostic({targetEl:el,hostEl:host});return}if(name==='HAND'){el.textContent='';[...text].forEach((ch,i)=>{const s=document.createElement('span');s.className='hand-char';s.textContent=ch===' '?'\u00a0':ch;const seed=(i*17+text.length*13)%31;s.style.setProperty('--d',i*39+'ms');s.style.setProperty('--x',((seed%5)-2)*.018+'em');s.style.setProperty('--y',(((seed*3)%7)-3)*.014+'em');s.style.setProperty('--r',(((seed*7)%9)-4)*.8+'deg');el.appendChild(s)});void el.offsetWidth;el.classList.add('hand-live');return}if(name==='COMPILE_INTERPRET'){el.textContent='';[...text].forEach((ch,i)=>{const s=document.createElement('span');s.className='compile-char';s.dataset.o=ch;s.dataset.h=ch.codePointAt(0).toString(16).toUpperCase().padStart(2,'0');s.textContent=ch===' '?'\u00a0':ch;s.style.setProperty('--d',i*24+'ms');el.appendChild(s)});void el.offsetWidth;el.classList.add('compile-live');const cs=[...el.children];await sleep(115);cs.forEach((s,i)=>{if(s.dataset.o!==' ')s.textContent=s.dataset.h[i%2]});await sleep(115);cs.forEach(s=>s.textContent=s.dataset.o===' '?'\u00a0':s.dataset.o);return}if(name==='ORGANIC_FIELD'||name==='GLYPH_CURRENT'){el.textContent='';const f=document.createElement('div');f.className='field';el.appendChild(f);const gs=name==='GLYPH_CURRENT'?HM.makeGlyphCurrent({count:80,seed:7}):HM.makeAsciiGlyphs({count:70,seed:7});for(let i=0;i<gs.length;i++){const s=document.createElement('i');s.className='glyph';s.textContent=gs[i].glyph;s.style.left=((i*37)%97)+'%';s.style.top=((i*61)%91)+'%';f.appendChild(s)}return}const anim=(frames,opt)=>el.animate(frames,opt);switch(name){case'ABSENCE':anim([{opacity:1,offset:0},{opacity:1,offset:.32},{opacity:.28,offset:.33},{opacity:.28,offset:.55},{opacity:0,offset:.56},{opacity:0,offset:1}],{duration:HM.ABSENCE.durationMs,fill:'forwards'});break;case'DISTANCE':anim([{letterSpacing:'0px'},{letterSpacing:HM.DISTANCE.spacingPx+'px'},{letterSpacing:'0px'}],{duration:HM.DISTANCE.durationMs,easing:HM.DISTANCE.easing});break;case'FALL':anim([{transform:'none',opacity:1},{transform:`translate(${HM.FALL.xRangePx[1]}px,${HM.FALL.dropPx}px) rotate(${HM.FALL.rotationRangeDeg[1]}deg)`,opacity:.05}],{duration:1050,easing:'cubic-bezier(.35,.05,.7,.2)',fill:'forwards'});break;case'CROSS_OUT':{const l=document.createElement('i');Object.assign(l.style,{position:'absolute',left:'-3%',top:'52%',height:'1px',background:'currentColor',width:'0'});el.appendChild(l);l.animate([{width:'0'},{width:HM.CROSS_OUT.width}],{duration:HM.CROSS_OUT.durationMs,easing:'ease',fill:'forwards'});break}case'GLINT':{const g=document.createElement('i');g.textContent='✦';Object.assign(g.style,{position:'absolute',left:'50%',top:'-.8em',fontStyle:'normal'});el.appendChild(g);g.animate([{opacity:0,transform:'translate(-50%,.2em) scale(.2)'},{opacity:1,offset:.35},{opacity:0,transform:'translate(-50%,-.5em) scale(1.6)'}],{duration:HM.GLINT.durationMs,fill:'forwards'});break}case'THUNDERCLAP':el.style.opacity='0';break;case'AGENCY_GO':anim([{transform:'none'},{transform:`translateX(${HM.AGENCY_GO.translateXPx}px)`,offset:.45},{transform:'none'}],{duration:HM.AGENCY_GO.durationMs,easing:HM.AGENCY_GO.easing});break;case'LOVE_LEAN':anim([{transform:'none'},{transform:`rotate(-${HM.LOVE_LEAN.angleDeg}deg) translateY(-.05em)`,offset:.45},{transform:'none'}],{duration:HM.LOVE_LEAN.durationMs});break;case'CHANGE_REORIENT':anim([{transform:'none'},{transform:'scaleX(-1)',offset:.5},{transform:'none'}],{duration:HM.CHANGE_REORIENT.durationMs});break;case'RETURN_REGISTRATION':anim([{opacity:.15,filter:'blur(2px)',letterSpacing:'.18em'},{opacity:1,filter:'none',letterSpacing:'normal'}],{duration:HM.RETURN_REGISTRATION.durationMs,easing:HM.RETURN_REGISTRATION.easing});break;case'OBSERVATION_WATCHED':{const e=document.createElement('i');e.textContent='◉';Object.assign(e.style,{position:'absolute',left:'50%',top:'-1.1em',fontStyle:'normal',fontSize:'.65em'});el.appendChild(e);e.animate([{opacity:0},{opacity:1,offset:.3},{opacity:.15,offset:.55},{opacity:1,offset:.7},{opacity:0}],{duration:HM.OBSERVATION_WATCHED.durationMs,fill:'forwards'});break}case'TENDRIL_PIPER':anim([{textShadow:'none'},{textShadow:'-12px -7px 0 rgba(23,21,19,.18),12px 8px 0 rgba(23,21,19,.14)',offset:.55},{textShadow:'none'}],{duration:1800});break}}
</script></body></html>
