<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Dark Mechanics V9</title><style>:root{--c:#f2eee5;--x:#e8f6ff}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--c);height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif}.lab{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}.build{position:fixed;z-index:40;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);white-space:nowrap;font:700 9px ui-monospace,monospace;letter-spacing:.16em;color:rgba(242,238,229,.68)}.top{display:flex;justify-content:space-between;z-index:20}.label,.count{font:700 9px ui-monospace,monospace;letter-spacing:.16em;color:rgba(242,238,229,.42);text-transform:uppercase}.stage{position:relative;min-height:0;overflow:hidden}.specimen{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none}.specimen.active{opacity:1;pointer-events:auto}.field{position:relative;width:min(86vw,560px);height:58svh;display:grid;place-items:center;overflow:hidden}.phrase{position:relative;margin:0;max-width:12ch;text-align:center;font-size:clamp(34px,9.5vw,62px);line-height:1.03;letter-spacing:-.035em}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;z-index:20}button{font:600 10px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;color:rgba(242,238,229,.72);background:#000;border:1px solid rgba(242,238,229,.18);border-radius:99px;padding:10px 13px}.next{justify-self:end}.replay{justify-self:center}
/* VERSO: full registered under-page, cold silver exposure, no explanatory card. */.verso .plate{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.verso .front{z-index:5}.verso .under-sheet{position:absolute;inset:0;z-index:2;opacity:0;display:grid;grid-template-rows:1fr auto 1fr;padding:8%;background:#000;color:var(--x);filter:contrast(1.4)}.verso .under-title{align-self:center;font-size:clamp(40px,11vw,70px);line-height:.94;letter-spacing:-.045em;text-align:left;color:#f0fbff;text-shadow:0 0 1px #fff,0 0 7px rgba(194,232,255,.62),0 0 25px rgba(118,190,238,.28)}.verso .under-equation{align-self:end;font-size:clamp(20px,5vw,31px);color:rgba(207,238,255,.62)}.verso .under-foot{align-self:start;margin-top:1em;font-size:clamp(15px,4.2vw,23px);color:rgba(207,238,255,.5)}.verso .under-sheet:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 21% 37%,rgba(240,251,255,.62) 0 .55px,transparent .9px),radial-gradient(circle at 68% 61%,rgba(168,218,250,.4) 0 .5px,transparent .85px);background-size:4px 5px,7px 6px;opacity:.38;mix-blend-mode:screen}.verso .under-sheet:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 42% 49%,rgba(192,231,255,.18),transparent 65%);filter:blur(9px)}.verso .flash{position:absolute;z-index:7;inset:0;background:rgba(232,248,255,.25);opacity:0}.verso.run .flash{animation:vflash 4.5s steps(1,end) both}.verso.run .under-sheet{animation:underReveal 4.5s steps(1,end) both}.verso.run .front{animation:frontThin 4.5s steps(1,end) both}@keyframes vflash{0%,19%{opacity:0}20%{opacity:1}23%,100%{opacity:0}}@keyframes underReveal{0%,19%{opacity:0}20%,48%{opacity:1}49%,100%{opacity:0}}@keyframes frontThin{0%,19%{opacity:1}20%,48%{opacity:.07;color:rgba(222,243,255,.12)}49%,100%{opacity:1}}
/* REFLECTION: exact reflection tucked against source, quieter opacity, continuous animated water displacement. */.reflection .water{position:relative;width:100%;height:100%;display:grid;place-items:center}.reflection .source{position:absolute;top:25%;z-index:3;width:100%;text-align:center}.reflection .mirror{position:absolute;left:3%;top:36.5%;width:94%;height:42%;overflow:visible;opacity:.52;mask-image:linear-gradient(#000 0 45%,rgba(0,0,0,.62) 72%,transparent 100%);-webkit-mask-image:linear-gradient(#000 0 45%,rgba(0,0,0,.62) 72%,transparent 100%)}.reflection .mirrorText{font-family:Georgia,'Times New Roman',serif;font-size:54px;fill:#f2eee5;text-anchor:middle}.reflection.run .rippleWave{animation:rippleMove 5.2s cubic-bezier(.22,.61,.36,1) both}@keyframes rippleMove{0%,15%{transform:translateX(-85px);opacity:0}22%{opacity:.5}52%{transform:translateX(0);opacity:1}82%{transform:translateX(85px);opacity:.35}100%{transform:translateX(125px);opacity:0}}
</style></head><body><main class="lab"><div class="build">DARK MECHANICS LAB · V9 · TWO-LEFT-1</div><header class="top"><div class="label" id="name">VERSO · candidate</div><div class="count" id="count">1 / 2</div></header><section class="stage" id="stage"><article class="specimen verso active" data-name="VERSO"><div class="field"><div class="plate"><div class="under-sheet"><div class="under-equation">C = F(S)</div><div class="under-title">I could have been wrong.</div><div class="under-foot">But the page underneath was already there.</div></div><p class="phrase front">The observer was the instrument.</p><div class="flash"></div></div></div></article><article class="specimen reflection" data-name="REFLECTION"><div class="field"><div class="water"><p class="phrase source">The observer was the instrument.</p><svg class="mirror" viewBox="0 0 560 250" preserveAspectRatio="xMidYMid meet"><defs><filter id="waterFilter" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="turbulence" baseFrequency="0.003 0.024" numOctaves="2" seed="9" result="noise"><animate attributeName="baseFrequency" values="0.003 0.018;0.006 0.035;0.003 0.018" dur="3.2s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"><animate attributeName="scale" values="2;12;7;2" dur="3.2s" repeatCount="indefinite"/></feDisplacementMap></filter><radialGradient id="wave"><stop offset="0" stop-color="white" stop-opacity=".18"/><stop offset=".6" stop-color="white" stop-opacity=".04"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient></defs><g transform="translate(280 0) scale(1,-1) translate(0,-236)" filter="url(#waterFilter)"><text class="mirrorText" x="0" y="74"><tspan x="0" dy="0">The observer was</tspan><tspan x="0" dy="56">the instrument.</tspan></text></g><ellipse class="rippleWave" cx="280" cy="75" rx="115" ry="13" fill="url(#wave)"/></svg></div></div></article></section><nav class="bottom"><button id="prev">← Prev</button><button class="replay" id="replay">Replay</button><button class="next" id="next">Next →</button></nav></main><script>(()=>{const ss=[...document.querySelectorAll('.specimen')],name=document.getElementById('name'),count=document.getElementById('count');let i=0;function play(){let e=ss[i];e.classList.remove('run');void e.offsetWidth;e.classList.add('run')}function show(v){ss[i].classList.remove('active','run');i=(v+ss.length)%ss.length;ss[i].classList.add('active');name.textContent=ss[i].dataset.name+' · candidate';count.textContent=(i+1)+' / '+ss.length;requestAnimationFrame(play)}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);replay.onclick=play;let x=0;stage.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>55)show(i+(d<0?1:-1))},{passive:true});play()})();</script></body></html>
