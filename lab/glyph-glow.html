<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Glyph Glow Lab 1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#000;color:#f2ede2}.lab{min-height:100svh;padding:max(26px,env(safe-area-inset-top)) 22px max(32px,env(safe-area-inset-bottom));font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.head{text-align:center;font-size:9px;letter-spacing:.18em;color:rgba(242,237,226,.42);margin-bottom:10svh}.specimens{display:grid;gap:8svh;max-width:620px;margin:auto}.specimen{min-height:20svh;display:grid;grid-template-columns:1fr 1.2fr;align-items:center;border-top:1px solid rgba(242,237,226,.08);padding-top:4svh}.meta{font-size:9px;line-height:1.7;letter-spacing:.12em;color:rgba(242,237,226,.36)}.glyph{text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:clamp(54px,18vw,100px);line-height:1;color:#f2ede2}.whisper{text-shadow:0 0 4px rgba(255,250,239,.38),0 0 11px rgba(255,250,239,.18)}.luminous{text-shadow:0 0 3px rgba(255,250,239,.78),0 0 9px rgba(255,250,239,.52),0 0 22px rgba(255,250,239,.28),0 0 42px rgba(255,250,239,.12)}.radiant{text-shadow:0 0 2px rgba(255,252,244,.95),0 0 7px rgba(255,250,239,.82),0 0 15px rgba(255,250,239,.58),0 0 32px rgba(255,250,239,.38),0 0 62px rgba(255,250,239,.22),0 0 96px rgba(255,250,239,.12)}.note{margin:9svh auto 0;max-width:620px;font-size:9px;line-height:1.65;letter-spacing:.08em;color:rgba(242,237,226,.3);text-align:center}</style></head><body><main class="lab"><div class="head">GLYPH LIGHT · AUDITION 1 · GLOW ONLY</div><div class="specimens"><section class="specimen"><div class="meta">01 / WHISPER<br>cream core<br>small ambient halo</div><div class="glyph whisper">◉</div></section><section class="specimen"><div class="meta">02 / LUMINOUS<br>cream core<br>visible emission</div><div class="glyph luminous">✦</div></section><section class="specimen"><div class="meta">03 / RADIANT<br>cream core<br>large soft bloom</div><div class="glyph radiant">☿</div></section></div><div class="note">No motion. No reveal. No canvas. No shader. Three CSS light intensities only.</div></main></body></html>
