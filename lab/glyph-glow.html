<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Glyph Motion Lab 2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f2ede2}.lab{position:fixed;inset:0;background:#000;overflow:hidden}.head{position:fixed;z-index:5;left:50%;top:max(20px,env(safe-area-inset-top));transform:translateX(-50%);font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:rgba(242,237,226,.38);white-space:nowrap}.field{position:absolute;inset:7svh 4vw 5svh}.glyph{position:absolute;left:0;top:0;font-family:Georgia,'Times New Roman',serif;line-height:1;color:#f2ede2;will-change:transform;text-align:center;user-select:none;pointer-events:none}.luminous{text-shadow:0 0 3px rgba(255,250,239,.78),0 0 9px rgba(255,250,239,.52),0 0 22px rgba(255,250,239,.28),0 0 42px rgba(255,250,239,.12)}.radiant{text-shadow:0 0 2px rgba(255,252,244,.95),0 0 7px rgba(255,250,239,.82),0 0 15px rgba(255,250,239,.58),0 0 32px rgba(255,250,239,.38),0 0 62px rgba(255,250,239,.22),0 0 96px rgba(255,250,239,.12)}.note{position:fixed;z-index:5;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;color:rgba(242,237,226,.24);white-space:nowrap}</style></head><body><main class="lab"><div class="head">GLYPH MOTION · AUDITION 2</div><div class="field" id="field"></div><div class="note">LUMINOUS / RADIANT · RANDOM PER GLYPH</div></main><script>const field=document.getElementById('field');const chars=['✦','☿','◉','△','◇','⊙','✧','☽','☉','∞','⟡','✶','⌁','∴','⊕','⋄','⟁','◌'];const count=22;const items=[];const r=(a,b)=>a+Math.random()*(b-a);for(let i=0;i<count;i++){const el=document.createElement('span');el.className='glyph '+(Math.random()<.62?'luminous':'radiant');el.textContent=chars[Math.floor(Math.random()*chars.length)];el.style.fontSize=r(18,44)+'px';el.style.opacity=r(.55,.95);field.appendChild(el);items.push({el,x:r(0,innerWidth*.9),y:r(0,innerHeight*.82),vx:r(-.018,.018),vy:r(-.024,-.006),phase:r(0,Math.PI*2),amp:r(4,18),spin:r(-.003,.003),rot:r(-20,20),scale:r(.82,1.16)});}let last=performance.now();function tick(now){const dt=Math.min(32,now-last);last=now;const w=field.clientWidth,h=field.clientHeight;for(const g of items){g.x+=g.vx*dt;g.y+=g.vy*dt;g.rot+=g.spin*dt;if(g.y<-90){g.y=h+50;g.x=r(0,w);g.el.className='glyph '+(Math.random()<.62?'luminous':'radiant');}if(g.x<-80)g.x=w+40;if(g.x>w+80)g.x=-40;const drift=Math.sin(now*.00045+g.phase)*g.amp;const breathe=1+Math.sin(now*.0011+g.phase)*.035;g.el.style.transform=`translate3d(${g.x+drift}px,${g.y}px,0) rotate(${g.rot}deg) scale(${g.scale*breathe})`;}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></body></html>
