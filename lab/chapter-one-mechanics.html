<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Chapter One Mechanics Lab</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#f6f0e6}body{font-family:Baskerville,"Iowan Old Style",Georgia,serif}.lab{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}.build{position:fixed;z-index:50;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);font:700 9px ui-monospace,monospace;letter-spacing:.15em;color:rgba(246,240,230,.58);white-space:nowrap}.top{display:flex;justify-content:space-between;padding-top:18px}.label,.count{font:700 9px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,240,230,.42)}.stage{position:relative;min-height:0;overflow:hidden}.specimen{position:absolute;inset:0;display:none;place-items:center;padding:8vw}.specimen.active{display:grid}.phrase{position:relative;max-width:34rem;margin:0;text-align:center;font-size:clamp(1.1rem,4.4vw,1.45rem);line-height:1.5;color:rgba(246,240,230,.78)}.phrase.strong{color:#f6f0e6}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}button{font:600 10px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,240,230,.72);background:#000;border:1px solid rgba(246,240,230,.18);border-radius:99px;padding:10px 13px}.next{justify-self:end}.replay{justify-self:center}.certainty-card{width:min(34rem,84vw);font-size:clamp(1.1rem,4.4vw,1.45rem);line-height:1.5}.certainty-card [data-certainty]{opacity:0}.certainty-card .small{display:block;margin-top:.7em;font-size:.72em;opacity:0}.hm-dark-phosphor-ghost,.hm-dark-palimpsest-old,.hm-dark-verso-under,.hm-dark-beam-white{color:#f6f0e6!important}.hm-dark-verso-under{background:#000!important}.hm-manic-strike .hm-marker{background:repeating-linear-gradient(0deg,rgba(246,240,230,.93) 0 3px,rgba(246,240,230,.82) 4px 6px,rgba(246,240,230,.96) 7px 10px,rgba(246,240,230,.62) 11px 12px)!important}@media(min-width:701px){.phrase,.certainty-card{font-size:clamp(1rem,1.7vw,1.28rem)}}</style></head><body><main class="lab"><div class="build">APPROVED DARK + MANIC · ACTUAL CHAPTER TEXT SIZE</div><header class="top"><div class="label" id="name"></div><div class="count" id="count"></div></header><section class="stage" id="stage"></section><nav class="bottom"><button id="prev">← Prev</button><button class="replay" id="replay">Replay</button><button class="next" id="next">Next →</button></nav></main><script src="../house-mechanics.js?v=96"></script><script src="../house-mechanics-manic.js?v=13"></script><script>(()=>{const HM=window.HouseMechanics,stage=document.getElementById('stage'),name=document.getElementById('name'),count=document.getElementById('count');const specs=[
['CAST','You could stand at one and look outward and see only yourself.',e=>HM.cast(e)],['SHUTTER','Inside, I had become increasingly offended by existence.',e=>HM.shutter(e)],['PHOSPHOR','Then die.',e=>HM.phosphor(e)],['PALIMPSEST','But why?',e=>HM.palimpsest(e,'Why?')],['BEAM','the observer was the instrument.',e=>HM.beam(e)],['REAGENT','Consciousness.',e=>{e.classList.add('hm-react');HM.reagent(e,'.hm-react')}],['ACCUMULATE','Memory.',e=>{const a=HM.accumulate(e,'Memory.',{count:8});let n=0;e._timer=setInterval(()=>{a.expose();if(++n===8)clearInterval(e._timer)},260)}],['REFLECTION','At night they reflected the room.',e=>HM.reflection(e)],['VERSO','My hand',e=>{const under=document.createElement('span');under.textContent='my hand';e.parentElement.insertBefore(under,e);HM.verso(e.parentElement,{frontEl:e,underEl:under})}],['STRIKE','Probably wrong.',e=>HM.strike(e)],['CORRECTION','Piper.',e=>HM.correction(e,{first:'assistant',second:'friend',current:'Piper.'})],['PRESSURE','Again.',e=>HM.pressure(e)],['INTRUSION','I pushed on the answers.',e=>HM.intrusion(e)],['OVERTYPE','Again.',e=>HM.overtype(e)],['SCRAWL','Modify the hypothesis.',e=>HM.scrawl(e)],['CERTAINTY','I could still have been wrong.',null]
];let i=0,article=null;function build(){if(article){article.querySelectorAll('*').forEach(n=>n._timer&&clearInterval(n._timer));article.remove()}const [n,text,run]=specs[i];article=document.createElement('article');article.className='specimen active';if(n==='CERTAINTY'){const card=document.createElement('div');card.className='certainty-card';card.innerHTML='<span data-certainty>I could </span><span data-certainty>still, </span><span data-certainty>under a sufficiently narrow definition, </span><span data-certainty>have been wrong.</span><span class="small" data-certainty>Where “wrong” means a conclusion not licensed by the available evidence.</span><span class="small" data-certainty>P(H|E) ∝ P(E|H)P(H)</span>';article.appendChild(card);stage.appendChild(article);HM.certainty(card)}else if(n==='VERSO'){const host=document.createElement('p');host.className='phrase strong';const e=document.createElement('span');e.textContent=text;host.appendChild(e);article.appendChild(host);stage.appendChild(article);run(e)}else{const e=document.createElement('p');e.className='phrase strong';e.textContent=text;article.appendChild(e);stage.appendChild(article);run(e)}name.textContent=n+' · approved';count.textContent=(i+1)+' / '+specs.length}function show(v){i=(v+specs.length)%specs.length;build()}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);replay.onclick=build;let x=0;stage.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>55)show(i+(d<0?1:-1))},{passive:true});build()})();</script></body></html>
