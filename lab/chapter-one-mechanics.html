<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Approved Mechanics · Forensic Lab</title><style>:root{--c:#f6f0e6;--x:#e8f6ff;--read:clamp(1.1rem,4.4vw,1.45rem)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--c)}body{font-family:Baskerville,"Iowan Old Style",Georgia,serif}.lab{height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}.build{position:fixed;z-index:50;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);font:700 9px ui-monospace,monospace;letter-spacing:.15em;color:rgba(246,240,230,.58);white-space:nowrap}.top{display:flex;justify-content:space-between;padding-top:18px;z-index:20}.label,.count{font:700 9px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,240,230,.42)}.stage{position:relative;min-height:0;overflow:hidden}.specimen{position:absolute;inset:0;display:none;place-items:center}.specimen.active{display:grid}.field{position:relative;width:min(90vw,560px);height:62svh;display:grid;place-items:center;overflow:hidden}.phrase{position:relative;margin:0;width:min(34rem,84vw);text-align:center;font-size:var(--read);line-height:1.5;color:var(--c)}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;z-index:20}button{font:600 10px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,240,230,.72);background:#000;border:1px solid rgba(246,240,230,.18);border-radius:99px;padding:10px 13px}.next{justify-self:end}.replay{justify-self:center}.cast .phrase{color:rgba(246,240,230,.055)}.cast .phrase:after{content:attr(data-text);position:absolute;inset:0;color:transparent;background:radial-gradient(circle at var(--lx,-25%) 52%,#f6f0e6 0 9%,rgba(246,240,230,.76) 17%,rgba(246,240,230,.2) 31%,transparent 48%);background-clip:text;-webkit-background-clip:text}.cast.run .phrase:after{animation:cast 5.2s cubic-bezier(.3,.02,.22,1) both}@property --lx{syntax:'<percentage>';inherits:false;initial-value:-25%}@keyframes cast{0%{--lx:-30%;opacity:0}10%{opacity:1}45%{--lx:46%}72%{--lx:112%;opacity:.9}100%{--lx:135%;opacity:0}}.shutter .phrase{color:rgba(246,240,230,.06)}.shutter .phrase:after{content:attr(data-text);position:absolute;inset:0;color:var(--c);clip-path:inset(0 50%)}.shutter.run .phrase:after{animation:shutter 4.8s cubic-bezier(.7,0,.2,1) both}@keyframes shutter{0%,8%{clip-path:inset(0 50%)}34%,68%{clip-path:inset(0)}94%,100%{clip-path:inset(0 50%)}}.phosphor .flash,.phosphor .ghost{position:absolute;width:min(34rem,84vw);text-align:center;font-size:var(--read);line-height:1.5;opacity:0}.phosphor.run .flash{animation:pflash 5.8s both}.phosphor.run .ghost{animation:pghost 5.8s ease-out both}@keyframes pflash{0%,9%{opacity:0}10%{opacity:1;text-shadow:0 0 6px #fff,0 0 20px rgba(246,240,230,.55)}12%,100%{opacity:0}}@keyframes pghost{0%,10%{opacity:0}13%{opacity:.72}30%{opacity:.39;filter:blur(.7px)}58%{opacity:.16;filter:blur(1.5px)}100%{opacity:0;filter:blur(3px)}}.palimpsest .stack{position:relative;width:84vw;height:44svh;display:grid;place-items:center}.palimpsest .old{position:absolute;width:92%;font-size:var(--read);line-height:1.5;text-align:center;opacity:0;transform:rotate(-.7deg);mask-image:repeating-linear-gradient(174deg,#000 0 4px,transparent 5px 8px,#000 9px 14px,transparent 15px 20px);-webkit-mask-image:repeating-linear-gradient(174deg,#000 0 4px,transparent 5px 8px,#000 9px 14px,transparent 15px 20px)}.palimpsest.run .old{animation:arch 6.3s ease both}@keyframes arch{0%,12%{opacity:0}35%{opacity:.13}55%{opacity:.42}72%{opacity:.22}100%{opacity:.05}}.reagent .equation{font-size:var(--read);color:rgba(246,240,230,.24)}.reagent .react{display:inline-block;color:rgba(246,240,230,.24)}.reagent .flashfield{position:absolute;inset:14% 2%;background:radial-gradient(ellipse,rgba(246,240,230,.12),transparent 68%);opacity:0}.reagent.run .flashfield{animation:rfield 5.8s both}.reagent.run .react{animation:rdevelop 5.8s ease both}@keyframes rfield{0%,14%{opacity:0}16%{opacity:1}20%,100%{opacity:0}}@keyframes rdevelop{0%,15%{color:rgba(246,240,230,.24);text-shadow:none}17%{color:#fff;text-shadow:0 0 5px #fff,0 0 20px rgba(246,240,230,.72)}25%{color:var(--c);text-shadow:0 0 14px rgba(246,240,230,.28)}45%,72%{color:rgba(246,240,230,.88)}100%{color:rgba(246,240,230,.27);text-shadow:none}}.beam .field-inner{position:absolute;inset:0;display:grid;place-items:center}.beam .base{z-index:3;color:rgba(246,240,230,.055)}.beam .cone{position:absolute;z-index:4;left:-20%;top:-18%;width:105%;height:125%;clip-path:polygon(0 3%,12% 0,100% 80%,100% 100%);opacity:0;background:linear-gradient(120deg,rgba(246,240,230,.13),rgba(246,240,230,.035) 50%,transparent 78%);filter:blur(7px);overflow:hidden}.beam .dust{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(246,240,230,.24) 0 .6px,transparent .8px);background-size:19px 23px;opacity:.30}.beam .whiteText{position:absolute;z-index:5;inset:0;display:grid;place-items:center;opacity:0;clip-path:polygon(-20% -14%,-7.4% -18%,85% 82%,85% 107%)}.beam .whiteText .phrase{color:#fff}.beam.run .cone,.beam.run .whiteText{animation:beamOn 5.8s ease both}@keyframes beamOn{0%,12%{opacity:0}25%,72%{opacity:1}100%{opacity:0}}.accumulate .records{position:relative;width:84vw;height:24vh;display:grid;place-items:center}.accumulate .record{position:absolute;font-size:var(--read);line-height:1.5;text-align:center;width:min(34rem,84vw);opacity:0;transition:opacity .65s}.accumulate .record.on{opacity:var(--o,.2)}.verso{inset:-46px -18px -18px}.verso .bookpage{position:absolute;inset:0;background:#000;padding:max(72px,calc(env(safe-area-inset-top) + 52px)) 8vw max(60px,calc(env(safe-area-inset-bottom) + 44px));overflow:hidden}.verso .under{z-index:1;opacity:0;display:grid;grid-template-rows:auto 1fr auto;filter:contrast(1.25)}.verso .front{z-index:4;display:grid;grid-template-rows:auto 1fr auto}.verso .chapter{font:700 9px ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(246,240,230,.38)}.verso .body{align-self:center}.verso h1,.verso h2{margin:0 0 1em;font-size:calc(var(--read)*1.2);line-height:1.3;color:var(--c)}.verso p{max-width:34rem;margin:.85em 0;font-size:var(--read);line-height:1.5;color:rgba(246,240,230,.72)}.verso .under{color:var(--x)}.verso .under h2{color:#edf9ff;text-shadow:0 0 2px #fff,0 0 9px rgba(184,227,255,.48),0 0 30px rgba(111,186,235,.22)}.verso .under p{color:rgba(207,238,255,.52)}.verso .folio{font:700 9px ui-monospace,monospace;letter-spacing:.16em;opacity:.35}.verso .exposure{position:absolute;z-index:6;inset:0;background:radial-gradient(ellipse at 48% 46%,rgba(237,250,255,.28),rgba(185,226,252,.08) 48%,transparent 78%);opacity:0}.verso.run .under{animation:underX 5s steps(1,end) both}.verso.run .front{animation:frontX 5s steps(1,end) both}.verso.run .exposure{animation:flashX 5s steps(1,end) both}@keyframes underX{0%,20%{opacity:0}21%,53%{opacity:.68}54%,100%{opacity:0}}@keyframes frontX{0%,20%{opacity:1;filter:none}21%,53%{opacity:.42;filter:grayscale(1) contrast(.85)}54%,100%{opacity:1;filter:none}}@keyframes flashX{0%,20%{opacity:0}21%{opacity:1}24%,100%{opacity:0}}.certainty-page{position:relative;width:min(90vw,560px);height:62svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;padding:4% 5%}.certainty-chapter{font:700 8px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(246,240,230,.28)}.certainty-body{align-self:center;font-size:var(--read);line-height:1.48;color:rgba(246,240,230,.8)}.certainty-body p{margin:0 0 1em}.certainty-target{font-size:1.12em;color:var(--c)}.certainty-qualifier{font-size:.72em;font-style:italic;color:rgba(246,240,230,.72)}.certainty-definition,.certainty-equation{display:block;margin:.65em 0 0 1.4em;font-size:.72em;line-height:1.3;color:rgba(246,240,230,.66)}.certainty-equation{font-family:ui-monospace,monospace}.certainty-cite{position:absolute;right:4%;top:51%;width:28%;font:500 clamp(9px,2.4vw,13px)/1.22 ui-monospace,monospace;color:rgba(246,240,230,.58);transform:rotate(1.5deg)}.certainty-footnotes{align-self:end;border-top:1px solid rgba(246,240,230,.16);padding-top:.58em;min-height:15%;font-size:clamp(9px,2.35vw,12px);line-height:1.25;color:rgba(246,240,230,.63)}.certainty-footnote{display:block;margin:.22em 0}.certainty-page [data-certainty]{opacity:0}@media(min-width:701px){:root{--read:clamp(1rem,1.7vw,1.28rem)}}</style></head><body><main class="lab"><div class="build">FORENSIC LAB · APPROVED SCOPE · CERTAINTY FIX 1</div><header class="top"><div class="label" id="name"></div><div class="count" id="count"></div></header><section class="stage" id="stage"></section><nav class="bottom"><button id="prev">← Prev</button><button class="replay" id="replay">Replay</button><button class="next" id="next">Next →</button></nav></main><script src="../house-mechanics.js?v=96"></script><script src="../house-mechanics-manic.js?v=13"></script><script>(()=>{const HM=window.HouseMechanics,stage=document.getElementById('stage'),label=document.getElementById('name'),count=document.getElementById('count');const dark=['CAST','SHUTTER','PHOSPHOR','PALIMPSEST','VERSO','REFLECTION','BEAM','REAGENT','ACCUMULATE'],manic=['STRIKE','CORRECTION','PRESSURE','INTRUSION','OVERTYPE','SCRAWL','CERTAINTY'],all=[...dark,...manic];let i=0,el,timers=[];const later=(fn,t)=>timers.push(setTimeout(fn,t));function darkBuild(n){const a=document.createElement('article');a.className='specimen '+n.toLowerCase()+' active';if(n==='VERSO'){a.innerHTML='<section class="bookpage under"><div class="chapter">Chapter One · Page Two</div><div class="body"><h2>I could have been wrong.</h2><p>That possibility did not make the question smaller. It made the room around it larger.</p><p>C = F(S)</p><p>Difference in substrate. Difference in experience. No certainty required to continue.</p></div><div class="folio">02</div></section><section class="bookpage front"><div class="chapter">Chapter One · Page One</div><div class="body"><h1>The observer was the instrument.</h1><p>I kept returning to the same problem from different directions, expecting the shape of it to change.</p><p>P(H | E) ∝ P(E | H)P(H)</p><p>Instead, the question began changing the person asking it.</p></div><div class="folio">01</div></section><div class="exposure"></div>';return a}if(n==='REFLECTION'){a.innerHTML='<div class="field"><p class="phrase">At night they reflected the room.</p></div>';stage.appendChild(a);HM.reflection(a.querySelector('.phrase'));return a}if(n==='PHOSPHOR'){a.innerHTML='<div class="field"><div class="flash">Then die.</div><div class="ghost">Then die.</div></div>';return a}if(n==='PALIMPSEST'){a.innerHTML='<div class="field"><div class="stack"><div class="old">Why?</div><p class="phrase">But why?</p></div></div>';return a}if(n==='BEAM'){a.innerHTML='<div class="field"><div class="field-inner"><p class="phrase base">the observer was the instrument.</p><div class="cone"><div class="dust"></div></div><div class="whiteText"><p class="phrase">the observer was the instrument.</p></div></div></div>';return a}if(n==='REAGENT'){a.innerHTML='<div class="field"><div class="flashfield"></div><div class="equation">The <span class="react">consciousness</span> was the problem.</div></div>';return a}if(n==='ACCUMULATE'){a.innerHTML='<div class="field"><div class="records">'+['Memory.','Recurrence.','Integration.','Differentiation.','Time.','Self-reference.','Prediction.'].map((x,j)=>`<span class="record" style="--o:${.16+j*.1}">${x}</span>`).join('')+'</div></div>';return a}const text=n==='CAST'?'You could stand at one and look outward and see only yourself.':'Inside, I had become increasingly offended by existence.';a.innerHTML=`<div class="field"><p class="phrase" data-text="${text}">${text}</p></div>`;return a}function playDark(n,a){a.classList.remove('run');void a.offsetWidth;a.classList.add('run');if(n==='ACCUMULATE')a.querySelectorAll('.record').forEach((r,j)=>later(()=>r.classList.add('on'),500+j*420))}function manicBuild(n){const a=document.createElement('article');a.className='specimen active';const p=document.createElement('p');p.className='phrase';const map={STRIKE:'Probably wrong.',CORRECTION:'Piper.',PRESSURE:'Again.',INTRUSION:'I pushed on the answers.',OVERTYPE:'Again.',SCRAWL:'Modify the hypothesis.'};if(n==='CERTAINTY'){a.innerHTML='<div class="certainty-page"><div class="certainty-chapter">Chapter One · Notes from the edge</div><div class="certainty-body"><p>I kept returning to the same problem from different directions. Each answer seemed to produce another question.</p><p class="certainty-target"><span data-certainty>I could </span><span class="certainty-qualifier" data-certainty>still, under a sufficiently narrow definition, </span><span data-certainty>have been wrong.</span><span class="certainty-definition" data-certainty>Where “wrong” means a conclusion not licensed by the available evidence, rather than merely incomplete.</span><span class="certainty-equation" data-certainty>P(H|E) ∝ P(E|H)P(H)</span></p><p>That should have been enough. Instead, I wanted to know exactly how much uncertainty I was allowed to carry forward.</p></div><div class="certainty-cite" data-certainty>cf. Popper: falsifiability is not verification.</div><div class="certainty-footnotes"><span class="certainty-footnote" data-certainty>1. This requires distinguishing uncertainty from error.</span><span class="certainty-footnote" data-certainty>2. The definition itself may contain the disputed premise.</span><span class="certainty-footnote" data-certainty>3. Certainty may be the hidden requirement being smuggled into the question.</span></div></div>';stage.appendChild(a);HM.certainty(a.querySelector('.certainty-page'));return a}p.textContent=map[n];a.appendChild(p);stage.appendChild(a);({STRIKE:()=>HM.strike(p),CORRECTION:()=>HM.correction(p,{first:'assistant',second:'friend',current:'Piper.'}),PRESSURE:()=>HM.pressure(p),INTRUSION:()=>HM.intrusion(p),OVERTYPE:()=>HM.overtype(p),SCRAWL:()=>HM.scrawl(p)})[n]();return a}function build(){timers.forEach(clearTimeout);timers=[];if(el)el.remove();const n=all[i];if(dark.includes(n)){el=darkBuild(n);if(!el.isConnected)stage.appendChild(el);if(n!=='REFLECTION')requestAnimationFrame(()=>playDark(n,el))}else el=manicBuild(n);label.textContent=n+' · approved';count.textContent=(i+1)+' / '+all.length}function show(v){i=(v+all.length)%all.length;build()}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);replay.onclick=build;let x=0;stage.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>55)show(i+(d<0?1:-1))},{passive:true});build()})();</script></body></html>
