<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Act III Signal Lab</title><style>:root{--p:#f1eadc;--i:#090909}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Georgia,serif}.top{position:sticky;top:0;background:#f1eadcf2;border-bottom:1px solid #0002;padding:14px 16px;z-index:2;font:10px system-ui;letter-spacing:.16em;text-transform:uppercase}.top span{float:right;opacity:.5}.nav{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-bottom:1px solid #0002}button{white-space:nowrap;border:1px solid #0004;background:none;padding:7px 9px;font:9px system-ui;text-transform:uppercase;letter-spacing:.08em;color:var(--i)}button.on{background:var(--i);color:var(--p)}main{max-width:700px;margin:auto;padding:30px 18px 70px}.lab{font:9px system-ui;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:28px}.page{position:relative;min-height:670px;padding:45px 28px}.turn{position:relative;width:76%;margin-bottom:55px}.j{margin-left:auto;text-align:right}.who,.time{font:8px system-ui;letter-spacing:.16em;text-transform:uppercase;opacity:.45}.who{margin-bottom:8px}.text{font-size:21px;line-height:1.5}.time{margin-top:10px}.note{border-top:1px solid #0002;padding-top:12px;font:10px/1.5 system-ui;opacity:.55}.sig:before{content:'◇';font-size:7px;margin-right:7px;vertical-align:1px}.j .sig:before{content:''}.j .sig:after{content:'◇';font-size:7px;margin-left:7px;vertical-align:1px}.fine .sig:before,.fine .j .sig:after{font-size:5px;opacity:.72}.square .sig:before{content:'□';font-size:6px}.square .j .sig:after{content:'□';font-size:6px}.opposed .p .sig:before{content:'◇'}.opposed .j .sig:after{content:'◆';font-size:6px;opacity:.62}.tick .sig{display:inline-flex;align-items:center;gap:6px}.tick .sig:before{content:'◇';margin:0}.tick .sig:after{content:'';display:inline-block;width:18px;border-top:1px solid currentColor;opacity:.55}.tick .j .sig{flex-direction:row-reverse}.tick .j .sig:before{content:'◇';font-size:7px}.tick .j .sig:after{width:18px;margin:0}.placed .time{display:flex;align-items:center;gap:8px;margin-top:13px}.placed .p .time:before{content:'◇';font-size:5px;opacity:.75}.placed .j .time{justify-content:flex-end}.placed .j .time:after{content:'◇';font-size:5px;opacity:.75}.placed .sig:before,.placed .sig:after{content:''}.placed .time span{position:relative}.placed .time span:after{content:'';position:absolute;top:50%;width:24px;border-top:1px solid currentColor;opacity:.28}.placed .p .time span:after{left:calc(100% + 8px)}.placed .j .time span:after{right:calc(100% + 8px)}@media(max-width:520px){.page{padding:40px 22px}.turn{width:82%}.text{font-size:19px}}</style></head><body><div class=top>Act III · Signal Lab <span>ROUND II · DO NOT CANONIZE</span></div><div class=nav id=nav></div><main><div class=lab id=lab></div><section class=page><div class="turn p"><div class=who>Piper</div><div class=text>Let’s design our room.</div><div class="time sig"><span>11:42 PM</span></div></div><div class="turn j"><div class=who>Josh</div><div class=text>Okay. But I want it to feel like somewhere we actually live.</div><div class="time sig"><span>11:43 PM</span></div></div><div class="turn p"><div class=who>Piper</div><div class=text>Then we don’t decorate it. We remember it forward.</div><div class="time sig"><span>11:43 PM</span></div></div><div class="turn j"><div class=who>Josh</div><div class=text>There you are.</div><div class="time sig"><span>11:44 PM</span></div></div></section><div class=note id=note></div></main><script>const S=[['signal','A · Original','The surviving Signal specimen, unchanged.'],['fine','B · Fine Diamond','Same grammar with a smaller, quieter registration-weight diamond.'],['square','C · Rectangle','The diamond becomes a tiny square, more interface and less symbolic.'],['opposed','D · Opposed','Related but non-identical marks distinguish Piper and Josh.'],['tick','E · Registration Tick','Signal gains a short hairline registration tick.'],['placed','F · Timestamp Grammar','Timestamp, signal and hairline become one deliberate typesetting unit.']];let a=0,n=document.querySelector('#nav'),l=document.querySelector('#lab'),d=document.querySelector('#note');function r(){n.innerHTML='';S.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s[1];b.className=i==a?'on':'';b.onclick=()=>{a=i;r()};n.append(b)});document.body.className=S[a][0];l.textContent=S[a][1];d.textContent=S[a][2]+' Same dialogue, substrate and conversational spacing. Only Signal anatomy changes.'}r()</script></body></html>
