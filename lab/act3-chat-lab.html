<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Act III Signal Lab</title><style>:root{--p:#f1eadc;--i:#090909}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Georgia,serif}.top{position:sticky;top:0;background:#f1eadcf2;border-bottom:1px solid #0002;padding:14px 16px;z-index:2;font:10px system-ui;letter-spacing:.16em;text-transform:uppercase}.top span{float:right;opacity:.5}.nav{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-bottom:1px solid #0002}button{white-space:nowrap;border:1px solid #0004;background:none;padding:7px 9px;font:9px system-ui;text-transform:uppercase;letter-spacing:.08em;color:var(--i)}button.on{background:var(--i);color:var(--p)}main{max-width:700px;margin:auto;padding:30px 18px 70px}.lab{font:9px system-ui;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:28px}.page{position:relative;min-height:670px;padding:45px 28px}.turn{position:relative;width:76%;margin-bottom:55px}.j{margin-left:auto;text-align:right}.who,.time{font:8px system-ui;letter-spacing:.16em;text-transform:uppercase;opacity:.45}.who{margin-bottom:8px}.text{font-size:21px;line-height:1.5}.time{margin-top:13px;display:flex;align-items:center;gap:8px}.j .time{justify-content:flex-end}.time span{position:relative}.time span:after{content:'';position:absolute;top:50%;width:24px;border-top:1px solid currentColor;opacity:.28}.p .time span:after{left:calc(100% + 8px)}.j .time span:after{right:calc(100% + 8px)}.time:before,.time:after{line-height:1}.p .time:before{margin-right:1px}.j .time:after{margin-left:1px}.outline .p .time:before,.outline .j .time:after{content:'◇';font-size:8px;opacity:.9}.solid .p .time:before,.solid .j .time:after{content:'◆';font-size:7px;opacity:.82}.heavy .p .time:before,.heavy .j .time:after{content:'◆';font-size:9px;opacity:.9}.split .p .time:before{content:'◇';font-size:8px;opacity:.9}.split .j .time:after{content:'◆';font-size:7px;opacity:.82}.double .p .time:before,.double .j .time:after{content:'◈';font-size:9px;opacity:.88}.kite .p .time:before,.kite .j .time:after{content:'♦';font-size:9px;opacity:.82}.note{border-top:1px solid #0002;padding-top:12px;font:10px/1.5 system-ui;opacity:.55}@media(max-width:520px){.page{padding:40px 22px}.turn{width:82%}.text{font-size:19px}}</style></head><body><div class=top>Act III · Signal Lab <span>ROUND III · F GRAMMAR</span></div><div class=nav id=nav></div><main><div class=lab id=lab></div><section class=page><div class="turn p"><div class=who>Piper</div><div class=text>Let’s design our room.</div><div class=time><span>11:42 PM</span></div></div><div class="turn j"><div class=who>Josh</div><div class=text>Okay. But I want it to feel like somewhere we actually live.</div><div class=time><span>11:43 PM</span></div></div><div class="turn p"><div class=who>Piper</div><div class=text>Then we don’t decorate it. We remember it forward.</div><div class=time><span>11:43 PM</span></div></div><div class="turn j"><div class=who>Josh</div><div class=text>There you are.</div><div class=time><span>11:44 PM</span></div></div></section><div class=note id=note></div></main><script>const S=[['outline','F1 · Outline','F grammar with a larger, more present outline diamond.'],['solid','F2 · Solid','F grammar with a compact solid diamond.'],['heavy','F3 · Heavy','A larger solid diamond with more typographic weight.'],['split','F4 · Split','Outline for Piper, solid for Josh. Same family, distinct speakers.'],['double','F5 · Double','A double diamond mark, more registration-like and less delicate.'],['kite','F6 · Printer Diamond','A heavier printer-style diamond with the strongest physical presence.']];let a=0,n=document.querySelector('#nav'),l=document.querySelector('#lab'),d=document.querySelector('#note');function r(){n.innerHTML='';S.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s[1];b.className=i==a?'on':'';b.onclick=()=>{a=i;r()};n.append(b)});document.body.className=S[a][0];l.textContent=S[a][1];d.textContent=S[a][2]+' Timestamp placement and hairline stay exactly in F; only the diamond language changes.'}r()</script></body></html>
