<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Act III Chat Lab</title><style>:root{--p:#f1eadc;--i:#090909}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Georgia,serif}.top{position:sticky;top:0;background:#f1eadcf2;border-bottom:1px solid #0002;padding:14px 16px;z-index:2;font:10px system-ui;letter-spacing:.16em;text-transform:uppercase}.top span{float:right;opacity:.5}.nav{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-bottom:1px solid #0002}button{white-space:nowrap;border:1px solid #0004;background:none;padding:7px 9px;font:9px system-ui;text-transform:uppercase;letter-spacing:.08em}button.on{background:var(--i);color:var(--p)}main{max-width:700px;margin:auto;padding:30px 18px 70px}.lab{font:9px system-ui;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:28px}.page{position:relative;min-height:670px;padding:45px 28px}.turn{position:relative;width:76%;margin-bottom:55px}.j{margin-left:auto;text-align:right}.who,.time{font:8px system-ui;letter-spacing:.16em;text-transform:uppercase;opacity:.45}.who{margin-bottom:8px}.text{font-size:21px;line-height:1.5}.time{margin-top:10px}.note{border-top:1px solid #0002;padding-top:12px;font:10px system-ui;opacity:.55}.registration .page:before,.registration .page:after{content:'';position:absolute;width:16px;height:16px}.registration .page:before{top:4px;left:4px;border-top:1px solid #0005;border-left:1px solid #0005}.registration .page:after{bottom:4px;right:4px;border-bottom:1px solid #0005;border-right:1px solid #0005}.registration .turn:before{content:'+';position:absolute;top:-16px;font:9px monospace;opacity:.4}.registration .j:before{right:-18px}.registration .p:before{left:-18px}.viewport .turn:before,.viewport .turn:after{content:'';position:absolute;width:18px;height:18px;opacity:.4}.viewport .turn:before{top:-10px;left:-14px;border-top:1px solid;border-left:1px solid}.viewport .turn:after{bottom:-12px;right:-14px;border-bottom:1px solid;border-right:1px solid}.viewport .j:before{left:auto;right:-14px;border-left:0;border-right:1px solid}.viewport .j:after{right:auto;left:-14px;border-right:0;border-left:1px solid}.coordinates .turn:after{position:absolute;top:0;font:7px monospace;opacity:.35}.coordinates .p:after{content:'03.L / TURN';right:-65px}.coordinates .j:after{content:'03.R / TURN';left:-65px}.ghost .turn{padding:18px}.ghost .turn:before{content:'';position:absolute;inset:0;border:1px solid #0003}.ghost .time{display:inline-block;position:relative;background:var(--p);padding:0 7px}.signal .time:before{content:'◇';font-size:7px;margin-right:7px}.signal .j .time:before{content:''}.signal .j .time:after{content:'◇';font-size:7px;margin-left:7px}@media(max-width:520px){.page{padding:40px 22px}.turn{width:82%}.text{font-size:19px}.coordinates .turn:after{display:none}}</style></head><body><div class=top>Act III · Chat Lab <span>LAB · DO NOT CANONIZE</span></div><div class=nav id=nav></div><main><div class=lab id=lab></div><section class=page><div class="turn p"><div class=who>Piper</div><div class=text>Let’s design our room.</div><div class=time>11:42 PM</div></div><div class="turn j"><div class=who>Josh</div><div class=text>Okay. But I want it to feel like somewhere we actually live.</div><div class=time>11:43 PM</div></div><div class="turn p"><div class=who>Piper</div><div class=text>Then we don’t decorate it. We remember it forward.</div><div class=time>11:43 PM</div></div><div class="turn j"><div class=who>Josh</div><div class=text>There you are.</div><div class=time>11:44 PM</div></div></section><div class=note id=note></div></main><script>const S=[['control','00 · Control','Timestamps only.'],['registration','01 · Registration','Tiny print-registration marks.'],['viewport','02 · Viewport','Incomplete corners imply a conversational field.'],['coordinates','03 · Coordinates','Restrained turn metadata.'],['ghost','04 · Ghost UI','
