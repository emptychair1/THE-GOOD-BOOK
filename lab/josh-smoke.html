<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Brad Woods Smoke Twist Audit</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#eee9df}.lab{position:fixed;inset:0;background:#090909}.lab canvas{display:block;width:100%;height:100%}.label,.note{position:fixed;z-index:5;left:50%;transform:translateX(-50%);font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;white-space:nowrap;color:rgba(238,233,223,.55)}.label{top:max(18px,env(safe-area-inset-top))}.note{bottom:max(20px,env(safe-area-inset-bottom));font-size:8px;color:rgba(238,233,223,.34)}</style></head><body><main class="lab" id="lab"><div class="label">BRAD WOODS · EXACT TWIST AUDIT</div><div class="note">geometry + camera + shader values matched to donor</div></main><script type="module">import * as THREE from 'https://esm.sh/three';
const root=document.getElementById('lab');
const config={geometry:{width:1.5,height:6,segmentsPerLength:10},material:{textureURL:'https://garden.bradwoods.io/images/notes/smoke/perlinNoise.png',textureSample:{width:.5,height:.5},speed:.05,remap:{low:.4,high:1},edge:{x:.18,y:.08},twist:{sample:{x:.6,height:.2},strength:10,speed:.005}},camera:{fov:75,position:[-4,3,-5],target:[0,3,0]}};
const scene=new THREE.Scene();
const geometry=new THREE.PlaneGeometry(config.geometry.width,config.geometry.height,config.geometry.width*config.geometry.segmentsPerLength,config.geometry.height*config.geometry.segmentsPerLength);geometry.translate(0,config.geometry.height/2,0);
const texture=new THREE.TextureLoader().load(config.material.textureURL,()=>{},undefined,()=>document.querySelector('.note').textContent='texture failed to load');texture.wrapT=THREE.RepeatWrapping;
const rotate2D=`vec2 rotate2D(vec2 value,float angle){float s=sin(angle);float c=cos(angle);mat2 m=mat2(c,s,-s,c);return m*value;}`;
const uniforms={uTexture:new THREE.Uniform(texture),uTextureSampleWidth:new THREE.Uniform(config.material.textureSample.width),uTextureSampleHeight:new THREE.Uniform(config.material.textureSample.height),uTime:new THREE.Uniform(0),uSpeed:new THREE.Uniform(config.material.speed),uRemapLow:new THREE.Uniform(config.material.remap.low),uRemapHigh:new THREE.Uniform(config.material.remap.high),uEdgeX:new THREE.Uniform(config.material.edge.x),uEdgeY:new THREE.Uniform(config.material.edge.y),uTwistStrength:new THREE.Uniform(config.material.twist.strength),uTwistSampleX:new THREE.Uniform(config.material.twist.sample.x),uTwistSampleHeight:new THREE.Uniform(config.material.twist.sample.height),uTwistSpeed:new THREE.Uniform(config.material.twist.speed)};
const material=new THREE.ShaderMaterial({uniforms,vertexShader:`uniform sampler2D uTexture;uniform float uTime;uniform float uTwistStrength;uniform float uTwistSampleX;uniform float uTwistSampleHeight;uniform float uTwistSpeed;varying vec2 vUv;${rotate2D}void main(){float textureY=uv.y*uTwistSampleHeight-uTime*uTwistSpeed;float textureValue=texture(uTexture,vec2(uTwistSampleX,textureY)).r;float angle=textureValue*uTwistStrength;vec3 twistedPosition=position;twistedPosition.xz=rotate2D(twistedPosition.xz,angle);gl_Position=projectionMatrix*modelViewMatrix*vec4(twistedPosition,1.0);vUv=uv;}`,fragmentShader:`uniform sampler2D uTexture;uniform float uTextureSampleWidth;uniform float uTextureSampleHeight;uniform float uTime;uniform float uSpeed;uniform float uRemapLow;uniform float uRemapHigh;uniform float uEdgeX;uniform float uEdgeY;varying vec2 vUv;void main(){vec2 textureUv=vUv;textureUv.x*=uTextureSampleWidth;textureUv.y*=uTextureSampleHeight;textureUv.y-=uTime*uSpeed;float textureImpl=texture(uTexture,textureUv).r;textureImpl=smoothstep(uRemapLow,uRemapHigh,textureImpl);float fadeEdges=smoothstep(0.0,uEdgeX,vUv.x);fadeEdges*=smoothstep(1.0,1.0-uEdgeX,vUv.x);fadeEdges*=smoothstep(0.0,uEdgeY,vUv.y);fadeEdges*=smoothstep(1.0,1.0-uEdgeY,vUv.y);textureImpl*=fadeEdges;gl_FragColor=vec4(1.0,1.0,1.0,textureImpl);#include <tonemapping_fragment>#include <colorspace_fragment>}`,side:THREE.DoubleSide,transparent:true,depthWrite:false});
const mesh=new THREE.Mesh(geometry,material);mesh.scale.x*=-1;scene.add(mesh);
const camera=new THREE.PerspectiveCamera(config.camera.fov,innerWidth/innerHeight,.1,100);camera.position.set(...config.camera.position);camera.lookAt(...config.camera.target);scene.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setClearColor(0x090909,1);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));root.prepend(renderer.domElement);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))}addEventListener('resize',resize);resize();const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{uniforms.uTime.value=clock.getElapsedTime();renderer.render(scene,camera)});</script></body></html>
