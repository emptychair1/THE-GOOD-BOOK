<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Brad Woods Smoke Audition</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#eee9df}body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.lab{position:fixed;inset:0;background:#090909}.lab canvas{display:block;width:100%;height:100%}.label{position:fixed;z-index:5;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.14em;white-space:nowrap;color:rgba(238,233,223,.55)}.note{position:fixed;z-index:5;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.1em;color:rgba(238,233,223,.34);white-space:nowrap}</style></head><body><main class="lab" id="lab"><div class="label">BRAD WOODS · CIGARETTE SMOKE · STOCK AUDITION</div><div class="note">shader + perlin texture · no book choreography</div></main><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const root=document.getElementById('lab');
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0x000000,0);root.prepend(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,0,7.2);
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
const texture=loader.load('https://garden.bradwoods.io/images/notes/smoke/perlinNoise.png',()=>{},undefined,()=>{document.querySelector('.note').textContent='texture failed to load';});texture.wrapS=THREE.RepeatWrapping;texture.wrapT=THREE.RepeatWrapping;
const uniforms={uTexture:{value:texture},uTime:{value:0},uSpeed:{value:.115},uTextureSampleWidth:{value:1.45},uTextureSampleHeight:{value:2.6},uRemapLow:{value:.48},uRemapHigh:{value:.78},uEdgeX:{value:.34},uEdgeY:{value:.12},uTwistSampleX:{value:.42},uTwistSampleHeight:{value:2.25},uTwistSpeed:{value:.09},uTwistStrength:{value:4.5}};
const rotate2D=`vec2 rotate2D(vec2 value,float angle){float s=sin(angle);float c=cos(angle);mat2 m=mat2(c,s,-s,c);return m*value;}`;
const vertexShader=`uniform sampler2D uTexture;uniform float uTime;uniform float uTwistSampleX;uniform float uTwistSampleHeight;uniform float uTwistSpeed;uniform float uTwistStrength;varying vec2 vUv;${rotate2D}void main(){float textureY=uv.y*uTwistSampleHeight-uTime*uTwistSpeed;float textureValue=texture2D(uTexture,vec2(uTwistSampleX,textureY)).r;float angle=textureValue*uTwistStrength;vec3 twistedPosition=position;twistedPosition.xz=rotate2D(twistedPosition.xz,angle);gl_Position=projectionMatrix*modelViewMatrix*vec4(twistedPosition,1.0);vUv=uv;}`;
const fragmentShader=`uniform sampler2D uTexture;uniform float uTime;uniform float uSpeed;uniform float uTextureSampleWidth;uniform float uTextureSampleHeight;uniform float uRemapLow;uniform float uRemapHigh;uniform float uEdgeX;uniform float uEdgeY;varying vec2 vUv;void main(){vec2 textureUv=vUv;textureUv.x*=uTextureSampleWidth;textureUv.y*=uTextureSampleHeight;textureUv.y-=uTime*uSpeed;float smoke=texture2D(uTexture,textureUv).r;smoke=smoothstep(uRemapLow,uRemapHigh,smoke);float edge=smoothstep(0.0,uEdgeX,vUv.x);edge*=smoothstep(1.0,1.0-uEdgeX,vUv.x);edge*=smoothstep(0.0,uEdgeY,vUv.y);edge*=smoothstep(1.0,1.0-uEdgeY,vUv.y);smoke*=edge;gl_FragColor=vec4(vec3(1.0),smoke*.72);}`;
const material=new THREE.ShaderMaterial({uniforms,vertexShader,fragmentShader,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.NormalBlending});
const geometry=new THREE.PlaneGeometry(2.15,5.5,32,128);const smoke=new THREE.Mesh(geometry,material);smoke.position.y=.05;scene.add(smoke);
const clock=new THREE.Clock();function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function frame(){uniforms.uTime.value=clock.getElapsedTime();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();</script></body></html>
