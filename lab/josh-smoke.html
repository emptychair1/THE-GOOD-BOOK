<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Brad Woods Smoke Twist Audit B</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#eee9df}.lab{position:fixed;inset:0;background:#090909}.lab canvas{display:block;width:100%;height:100%}.label,.note{position:fixed;z-index:5;left:50%;transform:translateX(-50%);font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;white-space:nowrap;color:rgba(238,233,223,.55)}.label{top:max(18px,env(safe-area-inset-top))}.note{bottom:max(20px,env(safe-area-inset-bottom));font-size:8px;color:rgba(238,233,223,.34)}</style></head><body><main class="lab" id="lab"><div class="label">BRAD WOODS · TWIST AUDIT B</div><div class="note" id="note">loading donor texture…</div></main><script type="module">import * as THREE from 'https://esm.sh/three';
const root=document.getElementById('lab'),note=document.getElementById('note');
const scene=new THREE.Scene();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setClearColor(0x090909,1);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));root.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(55,1,.1,100);camera.position.set(-2.35,3,-6.2);camera.lookAt(0,3,0);
const geometry=new THREE.PlaneGeometry(1.5,6,15,60);geometry.translate(0,3,0);
const texture=new THREE.TextureLoader().load('https://garden.bradwoods.io/images/notes/smoke/perlinNoise.png',()=>{texture.wrapT=THREE.RepeatWrapping;texture.needsUpdate=true;note.textContent='donor texture loaded · twist active';},undefined,()=>{note.textContent='DONOR TEXTURE FAILED TO LOAD';});texture.wrapT=THREE.RepeatWrapping;
const uniforms={uTexture:{value:texture},uTime:{value:0},uSpeed:{value:.05},uTextureSampleWidth:{value:.5},uTextureSampleHeight:{value:.5},uRemapLow:{value:.4},uRemapHigh:{value:1},uTwistStrength:{value:10},uTwistSampleX:{value:.6},uTwistSampleHeight:{value:.2},uTwistSpeed:{value:.005}};
const vertexShader=`uniform sampler2D uTexture;uniform float uTime;uniform float uTwistStrength;uniform float uTwistSampleX;uniform float uTwistSampleHeight;uniform float uTwistSpeed;varying vec2 vUv;vec2 rotate2D(vec2 value,float angle){float s=sin(angle);float c=cos(angle);mat2 m=mat2(c,s,-s,c);return m*value;}void main(){float textureY=uv.y*uTwistSampleHeight-uTime*uTwistSpeed;float textureValue=texture2D(uTexture,vec2(uTwistSampleX,textureY)).r;float angle=textureValue*uTwistStrength;vec3 twistedPosition=position;twistedPosition.xz=rotate2D(twistedPosition.xz,angle);gl_Position=projectionMatrix*modelViewMatrix*vec4(twistedPosition,1.0);vUv=uv;}`;
const fragmentShader=`uniform sampler2D uTexture;uniform float uTime;uniform float uSpeed;uniform float uTextureSampleWidth;uniform float uTextureSampleHeight;uniform float uRemapLow;uniform float uRemapHigh;varying vec2 vUv;void main(){vec2 textureUv=vUv;textureUv.x*=uTextureSampleWidth;textureUv.y*=uTextureSampleHeight;textureUv.y-=uTime*uSpeed;float smoke=texture2D(uTexture,textureUv).r;smoke=smoothstep(uRemapLow,uRemapHigh,smoke);float edge=smoothstep(0.0,.14,vUv.x)*smoothstep(0.0,.14,1.0-vUv.x)*smoothstep(0.0,.05,vUv.y)*smoothstep(0.0,.05,1.0-vUv.y);float alpha=smoke*edge;gl_FragColor=vec4(vec3(.96,.98,.97),alpha);}`;
const material=new THREE.ShaderMaterial({uniforms,vertexShader,fragmentShader,side:THREE.DoubleSide,transparent:true,depthWrite:false});
const mesh=new THREE.Mesh(geometry,material);mesh.scale.x=-1;scene.add(mesh);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{uniforms.uTime.value=clock.getElapsedTime();renderer.render(scene,camera)});
</script></body></html>
