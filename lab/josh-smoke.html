<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Josh Smoke Placement Lab 2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#eee9df}.lab{position:fixed;inset:0;background:#090909;font-family:Georgia,'Times New Roman',serif}.book{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,620px);height:min(76svh,860px);background:#050505;box-shadow:0 24px 90px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.035);overflow:hidden;z-index:1}.page{position:absolute;inset:0;padding:11% 10% 10%}.voice{font:700 8px ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(238,233,223,.3)}h1{font-size:clamp(27px,7vw,45px);font-weight:400;line-height:1.08;margin:30% 0 1em;max-width:9ch}p{font-size:clamp(16px,4.2vw,23px);line-height:1.55;color:rgba(238,233,223,.72);margin:0 0 1em}.smoke{position:fixed;inset:0;z-index:2;pointer-events:none}.smoke canvas{display:block;width:100%;height:100%}.label,.note{position:fixed;z-index:5;left:50%;transform:translateX(-50%);font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;white-space:nowrap;color:rgba(238,233,223,.55)}.label{top:max(18px,env(safe-area-inset-top))}.note{bottom:max(20px,env(safe-area-inset-bottom));font-size:8px;color:rgba(238,233,223,.34)}</style></head><body><main class="lab"><div class="label">JOSH FOURTH WALL · SMOKE · GEOMETRY AUDITION 2</div><div class="book" id="book"><section class="page"><div class="voice">Josh · I</div><h1>I kept returning to the same question.</h1><p>The answer should have made the problem smaller. Instead it made another problem.</p><p>I wrote it down anyway.</p></section></div><div class="smoke" id="smoke"></div><div class="note" id="note">loading approved donor…</div></main><script type="module">import * as THREE from 'https://esm.sh/three';
const root=document.getElementById('smoke'),note=document.getElementById('note'),book=document.getElementById('book');const scene=new THREE.Scene();const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setClearColor(0x000000,0);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));root.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(55,1,.1,100);camera.position.set(-2.35,3,-6.2);camera.lookAt(0,3,0);
/* Same approved shader, but a longer/narrower presentation plane so the visible end exits frame. */const geometry=new THREE.PlaneGeometry(.82,11,16,110);geometry.translate(0,5.5,0);
const texture=new THREE.TextureLoader().load('https://garden.bradwoods.io/images/notes/smoke/perlinNoise.png',()=>{texture.wrapT=THREE.RepeatWrapping;texture.needsUpdate=true;note.textContent='donor visible · thin/tall/source-anchored';},undefined,()=>{note.textContent='DONOR TEXTURE FAILED TO LOAD';});texture.wrapT=THREE.RepeatWrapping;
const uniforms={uTexture:{value:texture},uTime:{value:0},uSpeed:{value:.05},uTextureSampleWidth:{value:.5},uTextureSampleHeight:{value:.5},uRemapLow:{value:.4},uRemapHigh:{value:1},uTwistStrength:{value:10},uTwistSampleX:{value:.6},uTwistSampleHeight:{value:.2},uTwistSpeed:{value:.005}};
const vertexShader=`uniform sampler2D uTexture;uniform float uTime;uniform float uTwistStrength;uniform float uTwistSampleX;uniform float uTwistSampleHeight;uniform float uTwistSpeed;varying vec2 vUv;vec2 rotate2D(vec2 value,float angle){float s=sin(angle);float c=cos(angle);mat2 m=mat2(c,s,-s,c);return m*value;}void main(){float textureY=uv.y*uTwistSampleHeight-uTime*uTwistSpeed;float textureValue=texture2D(uTexture,vec2(uTwistSampleX,textureY)).r;float angle=textureValue*uTwistStrength;vec3 twistedPosition=position;twistedPosition.xz=rotate2D(twistedPosition.xz,angle);gl_Position=projectionMatrix*modelViewMatrix*vec4(twistedPosition,1.0);vUv=uv;}`;
const fragmentShader=`uniform sampler2D uTexture;uniform float uTime;uniform float uSpeed;uniform float uTextureSampleWidth;uniform float uTextureSampleHeight;uniform float uRemapLow;uniform float uRemapHigh;varying vec2 vUv;void main(){vec2 textureUv=vUv;textureUv.x*=uTextureSampleWidth;textureUv.y*=uTextureSampleHeight;textureUv.y-=uTime*uSpeed;float smoke=texture2D(uTexture,textureUv).r;smoke=smoothstep(uRemapLow,uRemapHigh,smoke);float edge=smoothstep(0.0,.14,vUv.x)*smoothstep(0.0,.14,1.0-vUv.x)*smoothstep(0.0,.018,vUv.y);float alpha=smoke*edge;gl_FragColor=vec4(vec3(.96,.98,.97),alpha);}`;
const material=new THREE.ShaderMaterial({uniforms,vertexShader,fragmentShader,side:THREE.DoubleSide,transparent:true,depthWrite:false});const mesh=new THREE.Mesh(geometry,material);mesh.scale.x=-1;mesh.rotation.z=-.48;scene.add(mesh);
function screenToWorld(px,py,zPlane=0){const ndc=new THREE.Vector3(px/innerWidth*2-1,-(py/innerHeight)*2+1,.5);ndc.unproject(camera);const dir=ndc.sub(camera.position).normalize();const distance=(zPlane-camera.position.z)/dir.z;return camera.position.clone().add(dir.multiplyScalar(distance));}
function place(){const b=book.getBoundingClientRect();/* Cigarette source: just outside lower-left of the physical page. */const source=screenToWorld(b.left-8,b.bottom-34,0);mesh.position.copy(source);}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();place()}addEventListener('resize',resize);resize();requestAnimationFrame(place);const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{uniforms.uTime.value=clock.getElapsedTime();renderer.render(scene,camera)});</script></body></html>
