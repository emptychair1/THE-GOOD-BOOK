<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Numerical Press Tool</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.wrap{max-width:900px;margin:auto;padding:18px}.head{font-size:11px;letter-spacing:.09em;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{appearance:none;border:1px solid #777;background:#f4efe6;color:#111;font:11px inherit;padding:10px 12px;cursor:pointer}.btn:disabled{opacity:.4}.file{display:none}.status{font-size:10px;color:#aaa;margin:0 0 12px}.stage{background:#000;position:relative;width:100%;overflow:hidden}.stage canvas{display:block;width:100%;height:auto}.stage #digits{position:absolute;inset:0}.empty{padding:25vh 20px;text-align:center;color:#777;font-size:11px;letter-spacing:.08em}.note{font-size:10px;color:#777;line-height:1.5;margin-top:10px}</style></head><body><main class="wrap"><div class="head">THE GOOD BOOK · NUMERICAL PRESS TOOL · V4.1 LOCKED</div><div class="toolbar"><label class="btn" for="upload">UPLOAD IMAGE</label><input class="file" id="upload" type="file" accept="image/*"><button class="btn" id="save" disabled>SAVE PNG</button></div><div class="status" id="status">45% SUBSTRATE · ULTRA FINE 3.5PX · WAITING FOR IMAGE</div><div class="stage" id="stage"><div class="empty" id="empty">UPLOAD AN IMAGE</div><canvas id="substrate" hidden></canvas><canvas id="digits" hidden></canvas></div><div class="note">Local-only tool. Your uploaded image stays in this browser session. The saved PNG is the flattened Numerical Press result, not the source image.</div></main><canvas id="sample" hidden></canvas><script>const PI='3141592653589793238462643383279502884197169399375105820974944592307816406286208998628034825342117067982148086513282306647093844609550582231725359408128481117450284102701938521105559644622948954930381964428810975665933446128475 /2,p=0;status.textContent='RENDERING · 45% SUBSTRATE · ULTRA FINE 3.5PX';function chunk(){if(my!==job)return;const end=performance.now()+10;for(;y<H&&performance.now()<end;y+=cell){for(let x=cell/2;x<W;x+=cell){const c=lum(x,y),r=Math.max(1,cell*.62),a=lum(x-r,y),b=lum(x+r,y),u=lum(x,y-r),v=lum(x,y+r),d1=lum(x-r,y-r),d2=lum(x+r,y+r),mean=(c+a+b+u+v+d1+d2)/7,variance=(Math.abs(c-a)+Math.abs(c-b)+Math.abs(c-u)+Math.abs(c-v)+Math.abs(d1-d2))/5,edge=Math.min(1,variance*3.2),dark=1-mean,detail=Math.min(1,dark*.76+edge*.88),gate=((Math.floor(x/cell)*29+Math.floor(y/cell)*43)%103)/103,occupancy=Math.min(.995,.22+detail*.88);if(gate>occupancy)continue;const size=Math.max(3.2,cell*(.72+detail*.58)),weight=edge>.28||dark>.72?700:detail>.48?500:350,alpha=Math.min(1,.32+dark*.52+edge*.62);dc.font=font(weight,size);dc.fillStyle='rgba(246,240,230,'+alpha+')';dc.fillText(PI[p++%PI.length],x,y)}}if(y<H)requestAnimationFrame(chunk);else{status.textContent='READY · 45% SUBSTRATE · ULTRA FINE 3.5PX';save.disabled=false}}requestAnimationFrame(chunk)}save.onclick=()=>{if(save.disabled)return;const out=document.createElement('canvas');out.width=sub.width;out.height=sub.height;const oc=out.getContext('2d');oc.drawImage(sub,0,0);oc.drawImage(dig,0,0);out.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=currentName+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};</script></body></html>
