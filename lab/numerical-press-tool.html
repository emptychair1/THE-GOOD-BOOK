vas><script>(function(){var PI='3141592653589793238462643383279502884197169399375105820974944592307816406286208998628034825342117067982148086513282306647093844609550582231725359408128481117450284102701938521105559644622948954930381964428810975665933446128475648233786783165271201909145648566923460348610454326648213393607260249141273724587006606315588174881520920962829254091715364367892590360011330530548820466521384146951941511609';var opacity=.45,cell=3.5,job=0,currentName='numerical-press';var upload=document.getElementById('upload'),save=document.getElementById('save'),status=document.getElementById('status'),empty=document.getElementById('empty'),sample=document.getElementById('sample'),sub=document.getElementById('substrate'),dig=document.getElementById('digits');var sc=sample.getContext('2d'),su=sub.getContext('2d'),dc=dig.getContext('2d'),fontCache={};function font(w,s){var k=w+'|'+s.toFixed(1);if(!fontCache[k])fontCache[k]=w+' '+s.toFixed(1)+'px ui-monospace,SFMono-Regular,Menlo,monospace';return fontCache[k]}upload.addEventListener('change',function(){var f=upload.files&&upload.files[0];if(!f)return;currentName=(f.name.replace(/\.[^.]+$/,'')||'numerical-press')+'-numerical-press';save.disabled=true;status.textContent='LOADING IMAGE…';var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){render(img)};img.onerror=function(){status.textContent='COULD NOT LOAD IMAGE'};img.src=e.target.result};reader.onerror=function(){status.textContent='COULD NOT READ IMAGE'};reader.readAsDataURL(f)});function render(img){var my=++job,W=760,H=Math.round(W*img.naturalHeight/img.naturalWidth);sample.width=sub.width=dig.width=W;sample.height=sub.height=dig.height=H;sub.style.display='block';dig.style.display='block';empty.style.display='none';sc.clearRect(0,0,W,H);sc.drawImage(img,0,0,W,H);var im=sc.getImageData(0,0,W,H),d=im.data,L=new Float32Array(W*H),i,p,l,q;for(i=0,p=0;i<d.length;i+=4,p++){l=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;L[p]=l;q=l*255;d[i]=d[i+1]=d[i+2]=q}su.clearRect(0,0,W,H);su.fillStyle='#000';su.fillRect(0,0,W,H);su.globalAlpha=opacity;su.putImageData(im,0,0);su.globalAlpha=1;dc.clearRect(0,0,W,H);dc.textAlign='center';dc.textBaseline='middle';function lum(x,y){return L[Math.max(0,Math.min(H-1,Math.round(y)))*W+Math.max(0,Math.min(W-1,Math.round(x)))]}var y=cell/2,pi=0;status.textContent='RENDERING · 45% SUBSTRATE · ULTRA FINE 3.5PX';function chunk(){if(my!==job)return;var end=Date.now()+8;for(;y<H&&Date.now()<end;y+=cell){for(var x=cell/2;x<W;x+=cell){var c=lum(x,y),r=Math.max(1,cell*.62),a=lum(x-r,y),b=lum(x+r,y),u=lum(x,y-r),v=lum(x,y+r),d1=lum(x-r,y-r),d2=lum(x+r,y+r),mean=(c+a+b+u+v+d1+d2)/7,variance=(Math.abs(c-a)+Math.abs(c-b)+Math.abs(c-u)+Math.abs(c-v)+Math.abs(d1-d2))/5,edge=Math.min(1,variance*3.2),dark=1-mean,detail=Math.min(1,dark*.76+edge*.88),gate=((Math.floor(x/cell)*29+Math.floor(y/cell)*43)%103)/103,occupancy=Math.min(.995,.22+detail*.88);if(gate>occupancy)continue;var size=Math.max(3.2,cell*(.72+detail*.58)),weight=edge>.28||dark>.72?700:detail>.48?500:350,alpha=Math.min(1,.32+dark*.52+edge*.62);dc.font=font(weight,size);dc.fillStyle='rgba(246,240,230,'+alpha+')';dc.fillText(PI.charAt(pi++%PI.length),x,y)}}if(y<H)requestAnimationFrame(chunk);else{status.textContent='READY · 45% SUBSTRATE · ULTRA FINE 3.5PX';save.disabled=false}}requestAnimationFrame(chunk)}save.addEventListener('click',function(){if(save.disabled)return;var out=document.createElement('canvas');out.width=sub.width;out.height=sub.height;var oc=out.getContext('2d');oc.drawImage(sub,0,0);oc.drawImage(dig,0,0);function download(url){var a=document.createElement('a');a.href=url;a.download=currentName+'.png';document.body.appendChild(a);a.click();a.parentNode.removeChild(a)}if(out.toBlob){out.toBlob(function(blob){if(!blob)return;var url=URL.createObjectURL(blob);download(url);setTimeout(function(){URL.revokeObjectURL(url)},1500)},'image/png')}else{download(out.toDataURL('image/png'))}})})();</script
