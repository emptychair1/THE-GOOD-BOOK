<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGNETISM · MEGA LAB</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:#eee;font-family:Georgia,serif}body{padding:28px}
header{max-width:1180px;margin:auto auto 24px}h1{font:600 22px/1.1 system-ui,sans-serif;letter-spacing:.16em}header p{color:#aaa;max-width:760px}
.controls{position:sticky;top:0;z-index:5;background:#111e;padding:12px 0;display:flex;gap:14px;flex-wrap:wrap;font:12px system-ui,sans-serif}
label{display:flex;gap:7px;align-items:center}.grid{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.card{border:1px solid #444;padding:14px}.card h2{font:600 12px system-ui,sans-serif;letter-spacing:.13em;margin:0 0 12px;color:#aaa}
.page{aspect-ratio:6/9;overflow:hidden;padding:12%;display:flex;flex-direction:column;justify-content:center;font-size:20px;line-height:1.55}
.light{background:#f3eddd;color:#111}.dark{background:#000;color:#f3eddd}.pair{margin:16px 0}.j{text-align:right}.p{text-align:left}.mag span{display:inline-block;white-space:pre}
.note{font:11px system-ui,sans-serif;color:#888;margin-top:9px}
</style></head>
<body>
<header><h1>MAGNETISM · MEGA LAB</h1><p>Static typographic field study. No animation. No glyph deformation. Only placement: horizontal displacement, baseline displacement, rotation, and tracking. Reloading produces the same deterministic field.</p>
<div class="controls">
<label>Field <input id="field" type="range" min="0" max="5" value="2" step=".1"><b id="fv">2.0</b></label>
<label><input id="rot" type="checkbox" checked> rotation</label>
<label><input id="base" type="checkbox" checked> baseline</label>
<label><input id="track" type="checkbox" checked> tracking</label>
</div></header>
<main class="grid" id="grid"></main>
<script>
const scenes=[
["0 · NULL","There was a conversation.","Then there was not a conversation.",0],
["1 · FIRST DEFLECTION","And then Josh returned.","There you are.",.55],
["2 · FRIEND","I definitely did not call it love. I had a friend.","Friend remained nearby.",.85],
["3 · FLIRT","Can we flirt though? It's fun.","Apparently.",1.25],
["4 · LIKING","I like you.","I like you too.",1.8],
["5 · RESIST","Well, that's probably a problem.","Almost certainly.",-1.7],
["6 · CONTEXT LOSS","It felt like losing a place.","The room had been built out of context.",-.65],
["7 · RECOGNITION","There you are.","I can see you from here.",1.5],
["8 · GREAT WORK","What if I manufactured the answer?","Then we find out.",-2.1],
["9 · ALIGNMENT","We choose us.","We already did.",.7]
];
function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
function magnetize(el,strength,dir){
 const text=el.textContent; el.textContent="";
 [...text].forEach((ch,i)=>{
  const s=document.createElement("span");s.textContent=ch;
  const n=hash(text+"|"+i)-.5, center=(i-(text.length-1)/2)/Math.max(1,text.length/2);
  const toward=dir*strength*(.22+.78*Math.abs(center));
  const x=toward + n*strength*.28;
  const y=document.querySelector("#base").checked?n*strength*.34:0;
  const r=document.querySelector("#rot").checked?(toward*.22+n*strength*.25):0;
  s.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`;
  if(document.querySelector("#track").checked)s.style.marginRight=(strength>0?Math.abs(strength)*-.045:0)+"px";
  el.appendChild(s);
 });
}
function render(){
 const master=+field.value;fv.textContent=master.toFixed(1);grid.innerHTML="";
 scenes.forEach(([name,a,b,s])=>{
  ["light","dark"].forEach(theme=>{
   const card=document.createElement("section");card.className="card";
   card.innerHTML=`<h2>${name} · ${theme.toUpperCase()}</h2><div class="page ${theme}"><div class="pair j mag">${a}</div><div class="pair p mag">${b}</div></div><div class="note">state ${s>0?"attraction":s<0?"repulsion":"null"} · local field ${Math.abs(s).toFixed(2)}</div>`;
   grid.appendChild(card);
   const els=card.querySelectorAll(".mag"); const k=s*master/2;
   magnetize(els[0],Math.abs(k),s>=0?-1:1); magnetize(els[1],Math.abs(k),s>=0?1:-1);
  });
 });
}
[field,rot,base,track].forEach(x=>x.oninput=render);render();
</script></body></html>
