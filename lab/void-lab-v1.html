<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID LAB · V3</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0b0a;color:#777772;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}header{padding:15px 18px;border-bottom:1px solid #292927;font-size:12px;font-weight:700;letter-spacing:.18em}.wrap{max-width:720px;margin:auto;padding:18px}.label{font-size:10px;letter-spacing:.15em;margin:0 0 10px}.stage{position:relative;width:100%;aspect-ratio:9/14;overflow:hidden;background:#171715;border:1px solid #292927}canvas{position:absolute;inset:0;width:100%;height:100%}.note{font:11px/1.5 Georgia,serif;margin-top:10px;color:#666661}</style></head><body><header>VOID LAB · V3 · STARE BACK AUDITION</header><div class="wrap"><div class="label">D · IMPOSSIBLE π</div><div class="stage"><canvas id="field"></canvas></div><div class="note">No controls. One numerical field. Watch it long enough.</div></div><script>
const PI='314159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196';const c=document.getElementById('field'),ctx=c.getContext('2d');let W,H,dpr,mask,cols,rows,step=8,rowH=9.2;
function size(){let r=c.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;cols=Math.ceil(W/step);rows=Math.ceil(H/rowH);buildMask()}
function buildMask(){let o=document.createElement('canvas');o.width=Math.ceil(W);o.height=Math.ceil(H);let x=o.getContext('2d');x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';let fs=Math.max(18,Math.min(30,W*.064));x.font=`700 ${fs}px Georgia,serif`;x.fillText('THE VOID STARES BACK',W/2,H*.505);mask=x.getImageData(0,0,o.width,o.height).data}
function hash(q,r){let n=Math.sin(q*12.9898+r*78.233+19.73)*43758.5453;return n-Math.floor(n)}
function ease(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
function strength(t){let p=(t%14000)/14000;if(p<.22)return 0;if(p<.48)return ease(.22,.48,p);if(p<.68)return 1;if(p<.94)return 1-ease(.68,.94,p);return 0}
function draw(t){let s=strength(t);ctx.fillStyle='#171715';ctx.fillRect(0,0,W,H);ctx.font='8px ui-monospace,SFMono-Regular,Menlo,monospace';ctx.textBaseline='top';for(let r=0;r<rows;r++){for(let q=0;q<cols;q++){let px=q*step,py=r*rowH,n=hash(q,r),idx=(r*cols+q)%PI.length,ch=PI[idx],base=.085+n*.075;let ix=Math.min(Math.ceil(W)-1,Math.floor(px)),iy=Math.min(Math.ceil(H)-1,Math.floor(py));let inside=mask&&mask[(iy*Math.ceil(W)+ix)*4]>20;if(inside&&s>0){let threshold=.92-s*.78;if(n>threshold){base+=s*(.23+n*.10);ch=PI[(idx+7)%PI.length]}else{base+=s*.035}}ctx.fillStyle=`rgba(5,5,4,${Math.min(.46,base)})`;ctx.fillText(ch,px,py)}}requestAnimationFrame(draw)}addEventListener('resize',size);size();requestAnimationFrame(draw);
</script></body></html>
