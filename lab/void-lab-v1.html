<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID LAB · V18</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0b0a;color:#777772;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}header{padding:15px 18px;border-bottom:1px solid #292927;font-size:12px;font-weight:700;letter-spacing:.18em}.wrap{max-width:720px;margin:auto;padding:18px}.label{font-size:10px;letter-spacing:.15em;margin:0 0 10px}.stage{position:relative;width:100%;aspect-ratio:9/14;overflow:hidden;background:#171715;border:1px solid #292927}.act{position:absolute;z-index:2;top:6.5%;left:0;width:100%;text-align:center;color:#090908;font-family:Georgia,'Times New Roman',serif;font-size:clamp(22px,6vw,42px);font-weight:700;letter-spacing:.22em;padding-left:.22em;pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%}.note{font:11px/1.5 Georgia,serif;margin-top:10px;color:#666661}</style></head><body><header>VOID LAB · V18 · OUR MONOLITH</header><div class="wrap"><div class="label">D · IMPOSSIBLE π</div><div class="stage"><div class="act">ACT I</div><canvas id="field"></canvas></div><div class="note">Approved monolith asset supplies the form. Its pixels never overlay the Void; they only decide which existing digits cohere.</div></div><script>
const PI='314159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196';const GLYPHS=['○','△','□','◇','+','×','⊙','⌁','∴','∵','∞','⌂','⋮','≡','⊕','⊗','◊','⌬','⋰','⋱'];const MONO_SRC='../assets/1F549874-9253-4EB2-A67F-36C15BC3BFF5.png';const c=document.getElementById('field'),ctx=c.getContext('2d'),monoImg=new Image();let W,H,dpr,mask,halo,monoMask,monoDetail,cols,rows,step=3.35,rowH=4.15;
const ENCOUNTER=30000,REST_IN=4500,FORM_END=12000,STARE_END=17500,LOSE_END=26000,STREAM_IN=7600,STREAM_OUT=25200,MONO_IN=8600,MONO_HOLD=17400,MONO_OUT=25800;
monoImg.onload=()=>{buildMonolith();};monoImg.src=MONO_SRC;
function size(){let r=c.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;cols=Math.ceil(W/step);rows=Math.ceil(H/rowH);buildMask();if(monoImg.complete&&monoImg.naturalWidth)buildMonolith()}
function fitFont(x,text,maxWidth,start){let fs=start;while(fs>32){x.font=`700 ${fs}px Georgia,Times New Roman,serif`;if(x.measureText(text).width<=maxWidth)return fs;fs-=1}return fs}
function buildMask(){let o=document.createElement('canvas');o.width=Math.ceil(W);o.height=Math.ceil(H);let x=o.getContext('2d');x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';let maxW=W*.90;let fs=Math.min(fitFont(x,'THE VOID',maxW,Math.min(96,W*.23)),fitFont(x,'STARES BACK',maxW,Math.min(96,W*.23))),gap=fs*1.08;x.font=`700 ${fs}px Georgia,Times New Roman,serif`;x.fillText('THE VOID',W/2,H*.50-gap*.53,maxW);x.fillText('STARES BACK',W/2,H*.50+gap*.53,maxW);mask=x.getImageData(0,0,o.width,o.height).data;let h=document.createElement('canvas');h.width=o.width;h.height=o.height;let hx=h.getContext('2d');hx.filter=`blur(${Math.max(4,fs*.075)}px)`;hx.drawImage(o,0,0);halo=hx.getImageData(0,0,h.width,h.height).data}
function buildMonolith(){if(!W||!H)return;let o=document.createElement('canvas');o.width=Math.ceil(W);o.height=Math.ceil(H);let x=o.getContext('2d',{willReadFrequently:true});let targetH=H*.49,targetW=Math.min(W*.44,targetH*(monoImg.naturalWidth/monoImg.naturalHeight)),dx=(W-targetW)/2,dy=H*.175;x.drawImage(monoImg,dx,dy,targetW,targetH);let d=x.getImageData(0,0,o.width,o.height).data;monoMask=new Float32Array(o.width*o.height);monoDetail=new Float32Array(o.width*o.height);for(let i=0,j=0;i<d.length;i+=4,j++){let a=d[i+3]/255,lum=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;/* Dark authored form becomes strongest coherence; pale/background pixels vanish. This preserves the real silhouette and its teeth/relief without drawing the bitmap itself. */let ink=a*Math.pow(1-lum,1.35);monoMask[j]=ink>.10?Math.min(1,(ink-.10)/.62):0;monoDetail[j]=monoMask[j]*(.72+.28*(1-lum))}}
function hash(q,r){let n=Math.sin(q*12.9898+r*78.233+19.73)*43758.5453;return n-Math.floor(n)}function smooth(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}function encounterTime(t){return t%ENCOUNTER}
function localStrength(ms,q,r){if(ms<REST_IN||ms>=LOSE_END)return 0;let n=hash(Math.floor(q/5),Math.floor(r/4)),wave=Math.sin(q*.19+r*.13+ms*.00042)*.5+.5,lag=(n-.5)*1450+(wave-.5)*620;if(ms<FORM_END)return smooth(REST_IN+lag,FORM_END+lag*.34,ms);if(ms<STARE_END)return 1;return 1-smooth(STARE_END+lag*.28,LOSE_END+lag*.62,ms)}
function streamStrength(ms,q,r){let y=r/Math.max(1,rows-1);if(y<.67||ms<STREAM_IN||ms>STREAM_OUT)return 0;let x=q/Math.max(1,cols-1),n=hash(Math.floor(q/3)+91,Math.floor(r/3)+37),arrival=STREAM_IN+x*7200+(n-.5)*850,departure=arrival+5200+(n-.5)*900,form=smooth(arrival,arrival+1550,ms),lose=1-smooth(departure,departure+1900,ms),band=.58+.42*Math.sin(r*.23+q*.07);return Math.max(0,form*lose*(.72+.28*band))}
function monolithStrength(ms,px,py,q,r){if(!monoMask)return 0;let mw=Math.ceil(W),mh=Math.ceil(H),ix=Math.min(mw-1,Math.max(0,Math.floor(px+step*.5))),iy=Math.min(mh-1,Math.max(0,Math.floor(py+rowH*.5))),mi=iy*mw+ix,shape=monoMask[mi]||0;if(shape<=0)return 0;let n=hash(Math.floor(q/4)+313,Math.floor(r/4)+127),lag=(n-.5)*1550+(1-shape)*850,form=smooth(MONO_IN+lag,MONO_HOLD+lag*.18,ms),lose=1-smooth(MONO_HOLD+lag*.12,MONO_OUT+lag*.42,ms);return Math.max(0,form*lose*shape*(monoDetail[mi]||1))}
function draw(t){let ms=encounterTime(t);ctx.fillStyle='#171715';ctx.fillRect(0,0,W,H);ctx.font='4.9px ui-monospace,SFMono-Regular,Menlo,monospace';ctx.textBaseline='top';let mw=Math.ceil(W),mh=Math.ceil(H);for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){let px=q*step,py=r*rowH,n=hash(q,r),idx=(r*cols+q)%PI.length,ch=PI[idx],ix=Math.min(mw-1,Math.floor(px+step*.5)),iy=Math.min(mh-1,Math.floor(py+rowH*.5)),mi=(iy*mw+ix)*4,m=mask?mask[mi]/255:0,near=halo?halo[mi]/255:0,inside=m>.012,s=localStrength(ms,q,r),gs=streamStrength(ms,q,r),mono=monolithStrength(ms,px,py,q,r),alpha=.052+n*.035,rgb='4,4,3';if(mono>0){alpha=Math.max(alpha,.08+mono*(.91+n*.03));rgb='9,9,8'}if(s>0){if(inside){let body=Math.pow(m,.34),breathe=(Math.sin(t*.00055+q*.11+r*.07)+1)*.5;alpha=Math.max(alpha,.19+s*(.78*body+n*.045)+s*breathe*.018);ch=PI[(idx+13)%PI.length];rgb='4,4,3'}else{alpha*=1-s*(near*.94);if(near>.018&&near<.96)alpha*=1-s*.84}}if(gs>0&&!inside){let select=hash(q*7+13,r*11+5);if(select>.83){ch=GLYPHS[Math.floor(hash(q+211,r+73)*GLYPHS.length)];alpha=Math.max(alpha,.16+gs*.84);rgb='9,9,8'}else alpha=Math.max(alpha,.045+gs*.07)}ctx.fillStyle=`rgba(${rgb},${Math.max(.004,Math.min(1,alpha))})`;ctx.fillText(ch,px,py)}requestAnimationFrame(draw)}addEventListener('resize',size);size();requestAnimationFrame(draw);
</script></body></html>
