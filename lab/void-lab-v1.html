<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID LAB · V6</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0b0a;color:#777772;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}header{padding:15px 18px;border-bottom:1px solid #292927;font-size:12px;font-weight:700;letter-spacing:.18em}.wrap{max-width:720px;margin:auto;padding:18px}.label{font-size:10px;letter-spacing:.15em;margin:0 0 10px}.stage{position:relative;width:100%;aspect-ratio:9/14;overflow:hidden;background:#171715;border:1px solid #292927}canvas{position:absolute;inset:0;width:100%;height:100%}.note{font:11px/1.5 Georgia,serif;margin-top:10px;color:#666661}</style></head><body><header>VOID LAB · V6 · LETTER SKELETON</header><div class="wrap"><div class="label">D · IMPOSSIBLE π</div><div class="stage"><canvas id="field"></canvas></div><div class="note">Same apparition. Stronger bones. The sentence must survive its substrate.</div></div><script>
const PI='314159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196';const c=document.getElementById('field'),ctx=c.getContext('2d');let W,H,dpr,mask,halo,cols,rows,step=5.7,rowH=6.8;
function size(){let r=c.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);c.width=r.width*dpr;c.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;cols=Math.ceil(W/step);rows=Math.ceil(H/rowH);buildMask()}
function spaced(ctx,text,cx,y,spacing){let widths=[...text].map(ch=>ctx.measureText(ch).width),total=widths.reduce((a,b)=>a+b,0)+spacing*(text.length-1),x=cx-total/2;for(let i=0;i<text.length;i++){ctx.fillText(text[i],x,y);x+=widths[i]+spacing}}
function buildMask(){let o=document.createElement('canvas');o.width=Math.ceil(W);o.height=Math.ceil(H);let x=o.getContext('2d');x.fillStyle='#fff';x.textAlign='left';x.textBaseline='middle';let fs=Math.max(43,Math.min(70,W*.158)),gap=fs*1.18,spacing=Math.max(1.5,fs*.035);x.font=`900 ${fs}px Arial Black,Arial,sans-serif`;spaced(x,'THE VOID',W/2,H*.50-gap*.54,spacing);spaced(x,'STARES BACK',W/2,H*.50+gap*.54,spacing);mask=x.getImageData(0,0,o.width,o.height).data;let h=document.createElement('canvas');h.width=o.width;h.height=o.height;let hx=h.getContext('2d');hx.filter=`blur(${Math.max(7,fs*.16)}px)`;hx.drawImage(o,0,0);halo=hx.getImageData(0,0,h.width,h.height).data}
function hash(q,r){let n=Math.sin(q*12.9898+r*78.233+19.73)*43758.5453;return n-Math.floor(n)}
function smooth(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
function strength(t){let p=(t%17000)/17000;if(p<.18)return 0;if(p<.43)return smooth(.18,.43,p);if(p<.72)return 1;if(p<.96)return 1-smooth(.72,.96,p);return 0}
function draw(t){let s=strength(t);ctx.fillStyle='#171715';ctx.fillRect(0,0,W,H);ctx.font='6.8px ui-monospace,SFMono-Regular,Menlo,monospace';ctx.textBaseline='top';let mw=Math.ceil(W),mh=Math.ceil(H);for(let r=0;r<rows;r++){for(let q=0;q<cols;q++){let px=q*step,py=r*rowH,n=hash(q,r),idx=(r*cols+q)%PI.length,ch=PI[idx];let ix=Math.min(mw-1,Math.floor(px+step*.5)),iy=Math.min(mh-1,Math.floor(py+rowH*.5)),mi=(iy*mw+ix)*4;let inside=mask&&mask[mi]>10,near=halo?halo[mi]/255:0;let alpha=.075+n*.055;if(s>0){if(inside){alpha=.15+s*(.72+n*.1);ch=PI[(idx+13)%PI.length]}else{let carve=Math.max(near,0);alpha*=1-s*(.30+carve*.67);if(near>.035&&near<.9)alpha*=1-s*.76}}ctx.fillStyle=`rgba(4,4,3,${Math.max(.004,Math.min(.94,alpha))})`;ctx.fillText(ch,px,py)}}requestAnimationFrame(draw)}addEventListener('resize',size);size();requestAnimationFrame(draw);
</script></body></html>
