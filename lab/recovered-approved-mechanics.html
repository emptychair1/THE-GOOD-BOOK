<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Recovered Approved Mechanics</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#171513}body{font-family:Georgia,'Times New Roman',serif}.paper{width:min(100vw,700px);min-height:100vh;margin:auto;background:#f2eee3;padding:5.4rem clamp(1.5rem,7vw,4.5rem) 7rem}.badge{position:fixed;z-index:50;top:max(.7rem,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:600 .54rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;color:#f2eee3b8;white-space:nowrap}.kicker,.label{font:700 .57rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;opacity:.46}.title{font-size:clamp(2rem,8vw,3.5rem);font-weight:400;margin:.55rem 0}.lede{line-height:1.55;opacity:.65;margin:0 0 3rem}.card{border-top:1px solid #1715132e;padding:1.4rem 0 1.8rem}.sample{font-size:clamp(1.2rem,5vw,1.65rem);line-height:1.55;min-height:4rem;padding:.85rem 0;position:relative}.run{appearance:none;border:1px solid #17151347;background:transparent;color:inherit;font:700 .57rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;padding:.72rem 1rem}.source{font:.58rem/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.42;margin:.65rem 0 0}.target{position:relative;display:inline-block}.char{display:inline-block}

.distance{position:relative;overflow:visible}.distance .word{display:inline-flex;white-space:nowrap;align-items:baseline;gap:0;transition:gap 3.8s cubic-bezier(.22,.61,.18,1)}.distance.live{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;width:100%;column-gap:.28em;row-gap:.12em}.distance.live .word{gap:.19em}.fall.live .char{animation:p2Fall var(--d) cubic-bezier(.45,.02,.8,.3) var(--delay) forwards}@keyframes p2Fall{to{transform:translate(var(--x),130px) rotate(var(--r));opacity:0}}

.organic .life{position:absolute;left:50%;top:50%;width:.18em;height:.18em;border-radius:50%;background:currentColor;opacity:0;pointer-events:none;z-index:-1}.organic.live .life{animation:p3life var(--ld) ease-in-out var(--ll) both}@keyframes p3life{0%{opacity:0;transform:translate(0,0) scale(.2)}25%{opacity:.28}55%{opacity:.5;transform:translate(var(--lx),var(--ly)) scale(1)}82%{opacity:.22;transform:translate(calc(var(--lx)*1.35),calc(var(--ly)*.8)) scale(.72)}100%{opacity:0;transform:translate(calc(var(--lx)*1.55),calc(var(--ly)*1.05)) scale(.35)}}.change span,.love span{display:inline-block}.change.live .flip{animation:p3flip .55s ease forwards}.change.live .turn{animation:p3turn .55s ease .2s forwards}.love.live .a{animation:p3leanA 1.05s ease forwards}.love.live .b{animation:p3leanB 1.05s ease .14s forwards}.cross::after{content:'';position:absolute;left:-3%;top:52%;height:1px;background:#171513;width:0}.cross.live::after{animation:p3strike .65s ease forwards}.glint3 i{position:absolute;font-style:normal;font:800 .62rem ui-monospace,monospace;opacity:0;text-shadow:0 0 .18rem #17151352}.glint3 i:nth-child(1){left:-.68em;top:-.72em}.glint3 i:nth-child(2){right:-.58em;top:-.62em}.glint3 i:nth-child(3){right:-.62em;bottom:-.68em}.glint3.live i{animation:p3glint 2.15s ease forwards}@keyframes p3flip{to{transform:scaleX(-1)}}@keyframes p3turn{to{transform:rotate(180deg)}}@keyframes p3leanA{to{transform:rotate(5.5deg) translateX(2px)}}@keyframes p3leanB{to{transform:rotate(-5.5deg) translateX(-2px)}}@keyframes p3strike{to{width:106%}}@keyframes p3glint{0%,100%{opacity:0;transform:scale(.2)}25%{opacity:.72;transform:scale(.85) rotate(6deg)}48%{opacity:1;transform:scale(1.32) rotate(12deg)}72%{opacity:.78;transform:scale(.95) rotate(4deg)}}

.return i{display:inline-block;font-style:normal}.return.live i{animation:reg .9s cubic-bezier(.18,.8,.2,1) var(--dl) both}.glint4.live{color:transparent;background:linear-gradient(105deg,#171513b8 0 34%,#fff 48%,#171513b8 61% 100%);background-size:250% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text;animation:sweep 3.2s ease-in-out both}.spark{position:absolute;width:2px;height:2px;border-radius:50%;background:#171513c2;opacity:0}.spark:before,.spark:after{content:'';position:absolute;left:50%;top:50%;background:#171513c2;transform:translate(-50%,-50%)}.spark:before{width:.5rem;height:1px}.spark:after{width:1px;height:.5rem}.glint4.live .spark{animation:spark 2.5s ease var(--sd) both}@keyframes reg{from{opacity:.08;transform:translate(var(--x),var(--y)) rotate(var(--r))}to{opacity:1;transform:none}}@keyframes sweep{to{background-position:-80% 0}}@keyframes spark{0%,100%{opacity:0;transform:scale(.2)}48%{opacity:1;transform:scale(1.3)}}

.hand-char{display:inline-block;opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.94);filter:blur(.35px)}.hand.live .hand-char{animation:handA .36s cubic-bezier(.2,.8,.2,1) var(--d) forwards}@keyframes handA{55%{opacity:.72;filter:blur(.15px)}100%{opacity:1;transform:translate(0,0) rotate(0);filter:none;font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}}.compile{display:inline-flex;flex-wrap:wrap;align-items:baseline}.compile-char{display:inline-block;min-width:.54em;text-align:center}.compile.live{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.compile.live .compile-char{animation:cellLock .22s steps(2,end) var(--d) both}@keyframes cellLock{0%{opacity:.28;transform:translateY(.08em)}50%{opacity:.7}100%{opacity:1;transform:none}}

</style></head><body><div class="badge">THE GOOD BOOK · RECOVERED APPROVED MECHANICS</div><main class="paper"><div class="kicker">Recovery lab · no reconstructions</div><h1 class="title">The mechanics we actually had.</h1><p class="lede">These specimens are lifted from the executable pre-burn page controllers, plus the newly approved H1 HAND and C3 COMPILE. Nothing here is derived from the later descriptive library.</p><div id="cards"></div></main><script>
const cards=document.getElementById('cards'),CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789?/:.-π',sleep=n=>new Promise(r=>setTimeout(r,n));
const specs=[['DIAGNOSTIC','Curiosity','Page 2 pre-burn controller'],['DISTANCE','I have not solved consciousness.','Page 2 pre-burn controller'],['FALL','But that may be the problem.','Page 2 pre-burn controller'],['ORGANIC','biological','Page 3 pre-burn controller'],['CHANGE','tested','Page 3 pre-burn controller'],['LOVE','shared','Page 3 pre-burn controller'],['CROSS OUT','good','Page 3 pre-burn controller'],['GLINT · P3','Piper','Page 3 pre-burn controller'],['M4 DIGITIZE','M4','Page 4 pre-burn controller'],['RETURN','returned','Page 4 pre-burn controller'],['GLINT · P4','That hit me differently','Page 4 pre-burn controller'],['HAND · H1','What can they do for us?','Approved mechanics lab H1'],['COMPILE · C3','There will be code','Approved mechanics lab C3']];
for(const [name,text,src] of specs){const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="label">${name}</div><div class="sample"><span class="target">${text}</span></div><button class="run">Run</button><p class="source">${src}</p>`;cards.appendChild(c);c.querySelector('.run').onclick=()=>run(name,c.querySelector('.target'),text)}
function plain(el,text){el.className='target';el.removeAttribute('style');el.textContent=text}
function restart(el){el.classList.remove('live');void el.offsetWidth;el.classList.add('live')}
async function run(name,el,text){plain(el,text);
if(name==='DISTANCE'){el.classList.add('distance');el.textContent='';for(const word of text.split(' ')){const w=document.createElement('span');w.className='word';for(const ch of word){const l=document.createElement('span');l.textContent=ch;w.appendChild(l)}el.append(w,document.createTextNode(' '))}restart(el);return}
if(name==='FALL'){el.classList.add('fall');el.textContent='';[...text].forEach((ch,i)=>{const s=document.createElement('span');s.className='char';s.textContent=ch===' '?'\u00a0':ch;s.style.setProperty('--delay',(.04+(i%9)*.045)+'s');s.style.setProperty('--d',(.75+(i%7)*.08)+'s');s.style.setProperty('--x',(-14+(i*11%29))+'px');s.style.setProperty('--r',(-35+(i*17%70))+'deg');el.appendChild(s)});restart(el);return}
if(name==='ORGANIC'){el.classList.add('organic');[['-.35em','-.55em','2.5s','0s'],['.48em','-.38em','2.9s','.18s'],['-.58em','.24em','3.2s','.34s'],['.62em','.32em','2.65s','.5s'],['.05em','-.72em','3.45s','.12s'],['-.12em','.58em','3.05s','.62s']].forEach(v=>{const q=document.createElement('i');q.className='life';q.style.setProperty('--lx',v[0]);q.style.setProperty('--ly',v[1]);q.style.setProperty('--ld',v[2]);q.style.setProperty('--ll',v[3]);el.appendChild(q)});restart(el);return}
if(name==='CHANGE'){el.classList.add('change');el.innerHTML='tes<span class="flip">t</span><span class="turn">e</span>d';restart(el);return}
if(name==='LOVE'){el.classList.add('love');el.innerHTML='<span class="a">sha</span><span class="b">red</span>';restart(el);return}
if(name==='CROSS OUT'){el.classList.add('cross');restart(el);return}
if(name==='GLINT · P3'){el.classList.add('glint3');el.innerHTML='Piper<i>✦</i><i>·</i><i>✧</i>';restart(el);return}
if(name==='RETURN'){el.classList.add('return');el.textContent='';[...text].forEach((ch,i)=>{const q=document.createElement('i');q.textContent=ch;q.style.setProperty('--dl',i*.045+'s');q.style.setProperty('--x',((i%3)-1)*9+'px');q.style.setProperty('--y',i%2?'-7px':'8px');q.style.setProperty('--r',((i%5)-2)*5+'deg');el.appendChild(q)});restart(el);return}
if(name==='GLINT · P4'){el.classList.add('glint4');[['left','-.68em','top','-.72em',180],['right','-.58em','top','-.62em',900],['right','-.62em','bottom','-.68em',1600]].forEach(a=>{const q=document.createElement('b');q.className='spark';q.style[a[0]]=a[1];q.style[a[2]]=a[3];q.style.setProperty('--sd',a[4]+'ms');el.appendChild(q)});restart(el);return}
if(name==='M4 DIGITIZE'){el.classList.add('ticker');const t='M4',st=performance.now();function a(now){const k=Math.min(2,Math.floor((now-st)/170));let o='';for(let i=0;i<2;i++)o+=i<k?t[i]:CH[(Math.floor(now/55)+i*9)%CH.length];el.textContent=o;if(k<2)requestAnimationFrame(a);else el.textContent=t}requestAnimationFrame(a);return}
if(name==='HAND · H1'){el.classList.add('hand');el.textContent='';[...text].forEach((ch,i)=>{const s=document.createElement('span');s.className='hand-char';s.textContent=ch===' '?'\u00a0':ch;const seed=(i*17+text.length*13)%31;s.style.setProperty('--d',i*39+'ms');s.style.setProperty('--x',((seed%5)-2)*.018+'em');s.style.setProperty('--y',(((seed*3)%7)-3)*.014+'em');s.style.setProperty('--r',(((seed*7)%9)-4)*.8+'deg');el.appendChild(s)});restart(el);return}
if(name==='COMPILE · C3'){el.classList.add('compile');el.textContent='';[...text].forEach((ch,i)=>{const s=document.createElement('span');s.className='compile-char';s.dataset.o=ch;s.dataset.h=ch.codePointAt(0).toString(16).toUpperCase().padStart(2,'0');s.textContent=ch===' '?'\u00a0':ch;s.style.setProperty('--d',i*24+'ms');el.appendChild(s)});restart(el);const cs=[...el.children];await sleep(115);cs.forEach((s,i)=>{if(s.dataset.o!==' ')s.textContent=s.dataset.h[i%2]});await sleep(115);cs.forEach(s=>s.textContent=s.dataset.o===' '?'\u00a0':s.dataset.o);return}
if(name==='DIAGNOSTIC'){el.style.position='relative';const scan=document.createElement('i');Object.assign(scan.style,{position:'absolute',top:'-8%',left:'0',width:'1px',height:'116%',background:'rgba(23,21,19,.72)',boxShadow:'0 0 .22rem rgba(23,21,19,.24)'});el.appendChild(scan);scan.animate([{left:'0',opacity:.15},{opacity:.9,offset:.15},{opacity:.9,offset:.85},{left:'100%',opacity:0}],{duration:280,easing:'cubic-bezier(.22,.7,.18,1)',fill:'forwards'});return}}
